"use strict";
/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800);}
function modal(html){$("modalbox").innerHTML=html;$("modal").classList.add("show");}
function closeModal(){$("modal").classList.remove("show");}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
function nowStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");}
</script>

 return s;

<script>

function calcStats(){
 const p=S.player;
 p.maxhp=p.base.maxhp+(p.level-1)*18; p.maxmp=p.base.maxmp+(p.level-1)*8;
 p.atk=p.base.atk+(p.level-1)*3; p.def=p.base.def+(p.level-1)*2; p.spd=p.base.spd+(p.level-1)*1;
 p.luck=0;
 for(const slot of["weapon","armor","boots","charm"]){
  const it=S.equip[slot]; if(!it)continue; const d=ITEMS[it.iid],e=it.enh||0;
  p.atk+=d.atk||0; p.def+=d.def||0; p.hp0=(p.hp0||0); p.spd+=d.spd||0; p.luck+=d.luck||0;
  if(d.hp)p.maxhp+=d.hp;
  if(slot==="weapon")p.atk+=e*2; if(slot==="armor")p.def+=e*2;
  if(slot==="boots")p.spd+=e*1; if(slot==="charm"){p.maxhp+=e*15;}
 }
 const worn=VIP_TITLES[S.title||0]; // 佩戴称号加成
 if(worn){p.atk+=worn.atk;p.maxhp+=worn.hp;}
 for(const[gid,lv]of Object.entries(S.gongfa||{})){const g=GONGFA[gid];if(!g||!lv)continue; // 功法加成
  for(const[k,v]of Object.entries(g.bonus)){

 const dq=DOUQI[S.douqi||0]; // 斗气境界加成
 if(dq)for(const[k,v]of Object.entries(dq.bonus)){if(k==="hp")p.maxhp+=v;else if(k==="mp")p.maxmp+=v;else p[k]=(p[k]||0)+v;}
 for(const fn of(S.yihuo||[])){const f=YIHUO.find(x=>x.name===fn);if(!f)continue; // 异火加成
  for(const[k,v]of Object.entries(f.bonus)){if(k==="hp")p.maxhp+=v;else if(k==="mp")p.maxmp+=v;else p[k]=(p[k]||0)+v;}}
 const fjlv=(S.fenjue&&S.fenjue.lv)||0,fm=fenjueTier()+1; // 焚诀加成（随异火进化）
 if(fjlv){p.atk+=4*fm*fjlv;p.maxhp+=50*fm*fjlv;p.maxmp+=10*fm*fjlv;}
 const wt=(S.wing&&S.wing.tier)||0; // 翅膀加成：每阶攻击+12 气血+120 速度+3
 if(wt){p.atk+=12*wt;p.maxhp+=120*wt;p.spd+=3*wt;}
 const ap=(S.partners||[])[S.activePartner]; // 出战伙伴：将其30%属性加给玩家
 if(ap){const st=partnerStats(ap);p.atk+=Math.floor(st.atk*0.3);p.def+=Math.floor(st.def*0.3);p.maxhp+=Math.floor(st.hp*0.3);p.spd+=Math.floor(st.spd*0.3);}
 for(const t of myRankTitles()){const b=t.bonus; // 排行榜称号加成（可叠加）
  p.atk+=b.atk||0;p.def+=b.def||0;p.maxhp+=b.hp||0;p.maxmp+=b.mp||0;p.spd+=b.spd||0;p.luck+=b.luck||0;}
 for(const eid of(S.eventTitles||[])){const e=EVENT_TITLES[eid];if(!e)continue;const b=e.bonus; // 节日称号加成（可叠加）
  p.atk+=b.atk||0;p.def+=b.def||0;p.maxhp+=b.hp||0;p.maxmp+=b.mp||0;p.spd+=b.spd||0;p.luck+=b.luck||0;}
 const vb=1+vipLevel()*0.02; // VIP加成：每级攻击/气血+2%
 p.atk=Math.floor(p.atk*vb); p.maxhp=Math.floor(p.maxhp*vb);
 p.hp=Math.min(p.hp,p.maxhp); p.mp=Math.min(p.mp,p.maxmp);
}

 const pet=S.pets[S.activePet]; if(pet){const b=PETS[pet.pid];z+=(b.atk*(1+0.15*(pet.level-1)))*2*(PET_TMULT[b.tier]||1);}
 return Math.floor(z);

}

 <p class="dim">师门任务：${p.task?("已接取：击败"+p.task.need+"个敌人（"+p.task.done+"/"+p.task.need+"）"+(p.taskDone?" ✅可领奖":"")):"未接取，去门派接取"}</p></div>`;

<script>
"use strict";
/* ============ 战斗 ============ */
function startBattle(zi,mi){
const p=S.player;
if(p.stamina<5){toast("体力不足，去打坐或商城买体力丹");return;}
p.stamina-=5;
const mo=ZONES[zi].mobs[mi]();
B={zi,mi,foe:{...mo,maxhp:mo.hp},log:[],over:false};
log(`<span class="sys">你在${ZONES[zi].name}遭遇了！</span>`);
save();rBattle();
}
function log(t){B.log.push(t);}
function dmgCalc(atk,def,mult,luck){
let d=Math.max(1,(atk*(mult||1.6)-def*0.8))* (0.9+Math.random()*0.2);
const crit=Math.random()<Math.min(0.5,0.15+(luck||0)*0.01); if(crit)d*=1.6;
return{h:Math.floor(d),crit};
}
function foeTurn(){
const f=B.foe,p=S.player;
if(f.hp<=0||B.over)return;
const d=dmgCalc(f.atk,p.def,1.5);
p.hp=Math.max(0,p.hp-d.h);
log(`<span class="foe">${f.name}攻来，造成 ${d.h} 点伤害${d.crit?"（暴击！）":""}</span>`);
if(p.hp<=0){endBattle(false);return;}
petTurn();
}
function petTurn(){
const pet=S.pets[S.activePet];
if(!pet||B.over)return;
const b=PETS[pet.pid],f=B.foe;
const pa=Math.floor(b.atk*(1+0.15*(pet.level-1))*(PET_TMULT[b.tier]||1));
const d=Math.max(1,Math.floor(pa*1.2-f.def*0.5));
f.hp=Math.max(0,f.hp-d);
log(`<span class="pet">协助攻击，造成 ${d} 点伤害</span>`);
if(f.hp<=0)endBattle(true);
}
function gainExp(n){
const p=S.player;p.exp+=n;
let ups=0;
while(p.exp>=expNeed(p.level)){p.exp-=expNeed(p.level);p.level++;ups++;}
if(ups>0){calcStats();p.hp=p.maxhp;p.mp=p.maxmp;log(`<span class="sys">🎉 升级了！当前 ${p.level} 级，气血内力回满！</span>`);}
}
function gainPetExp(n){
const pet=S.pets[S.activePet];if(!pet)return;
pet.exp+=n;
while(pet.exp>=petExpNeed(pet.level)){pet.exp-=petExpNeed(pet.level);pet.level++;}
}
function endBattle(win){
B.over=true;const p=S.player,f=B.foe;
if(win){
log(`<span class="sys">⚔️ 战胜了！获得修为 ${f.exp}、铜币 ${f.coins}</span>`);
gainExp(f.exp);p.coins+=f.coins;gainPetExp(Math.floor(f.exp/2));gainPartnerExp(Math.floor(f.exp/2));
if(B.wb){ // 世界BOSS：掉落功法（神级以下）
 const cand=Object.keys(GONGFA).filter(g=>GONGFA[g].tier!=="神"&&!gfLearned(g));
 if(cand.length){
  const w={黄:40,玄:30,地:20,天:10};let tot=0;
  const bag=cand.map(g=>{const ww=w[GONGFA[g].tier]||10;tot+=ww;return[g,ww];});
  let r=Math.random()*tot,pg=bag[0][0];
  for(const[g,ww]of bag){r-=ww;if(r<=0){pg=g;break;}}
  S.gongfaLearned=S.gongfaLearned||{};S.gongfaLearned[pg]=1;
  log(`<span class="sys">🎁 世界BOSS掉落：功法《${GONGFA[pg].name}》！去功法页修炼吧</span>`);
 }else{p.gold+=88;log(`<span class="sys">🎁 功法已集齐，获得88元宝！</span>`);}
 // 异火掉落（极低概率，VIP称号提升爆率）
 const unownedYH=YIHUO.filter(f=>!(S.yihuo||[]).includes(f.name));
 if(unownedYH.length&&Math.random()<0.03*(1+vipDrop()/100)){
  const yf=pick(unownedYH);S.yihuo=S.yihuo||[];S.yihuo.push(yf.name);
  log(`<span class="sys">🔥 天降机缘！世界BOSS掉落${yf.name}，已自动炼化！</span>`);
 }
 // 世界BOSS掉落灵羽（翅膀升阶材料）
 const fn=2+Math.floor(Math.random()*4);p.feather=(p.feather||0)+fn;
 log(`<span class="sys">🪶 世界BOSS掉落灵羽×${fn}！可在「翅膀」页升级翅膀</span>`);
}else if(B.arena){ // 竞技场：获胜提升排名
 const R=B.oppRank,A=S.arena;
 if(R<A.rank){
  for(const n of A.top)if(n.rank>=R)n.rank++;
  A.rank=R;
  log(`<span class="sys">🏆 挑战成功！竞技场排名升至第 <b>${R}</b> 名！</span>`);
 }
}else{
// 掉落（VIP称号提升爆率）
const tier=ZONES[B.zi].tier;
const pool=Object.keys(ITEMS).filter(k=>ITEMS[k].tier===tier&&!ITEMS[k].gift);
if(f.boss||Math.random()<0.3*(1+vipDrop()/100)){
const iid=pick(pool);
S.bag.push({iid,enh:0});
log(`<span class="sys">🎁 获得了！</span>`);
}
}
if(p.task&&!p.taskDone){p.task.done++;if(p.task.done>=p.task.need){p.taskDone=true;log(`<span class="sys">📜 师门任务完成，可回门派领奖！</span>`);}}
}else{
log(`<span class="sys">你败下阵来，被好心人救回，气血恢复…</span>`);
p.hp=1;
}
calcStats();save();
}
function rBattle(){
const m=$("main"),p=S.player,f=B.foe;
let h=`<div class="card"><h3>⚔️ ${f.name} ${f.boss?"👹":""} <span class="dim">Lv.${f.lv}</span></h3>
<div class="bar hp"><i style="width:${f.hp/f.maxhp*100}%"></i><span>${f.hp}/${f.maxhp}</span></div>
<div id="battlelog">${B.log.map(t=>`<p>${t}</p>`).join("")}</div>`;

h+=`<button class="btn primary" id="bback">继续闯荡</button></div>`;
}else{
h+=`<div class="rowbtns"><button class="btn" id="a_atk">普通攻击</button><button class="btn" id="a_med">吃药</button></div>
<div class="rowbtns">${p.skills.filter(s=>SKILLS[s]).map(s=>`<button class="btn small" data-sk="${s}">${SKILLS[s].name}(${SKILLS[s].mp}内)</button>`).join("")}</div>
<div class="rowbtns">${f.catchPet?`<button class="btn small" id="a_cap">🪤 捕捉</button>`:""}<button class="btn small danger" id="a_flee">逃跑</button></div></div>`;
}
m.innerHTML=h;
const bl=$("battlelog");bl.scrollTop=bl.scrollHeight;
if(B.over){$("bback").onclick=()=>{B=null;TAB="home";render();};return;}
$("a_atk").onclick=()=>doAtk(null);
m.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>doAtk(b.dataset.sk));
$("a_med").onclick=()=>{
const med=S.bag.find(x=>x.use);

 const lvlist=[...RANK_LV.map(r=>({...r})),{name:p.name+"（我）",lv:p.level,me:true}].sort((a,b)=>b.lv-a.lv);

 h+=lvlist.map((r,i)=>`<div class="rankrow${r.me?" me":""}"><span>${i+1}. ${r.name}${i<3?` ${titleBadge(RANK_TITLES.lv[i].name,RANK_TITLES.lv[i].cls)}`:""}</span><span>Lv.${r.lv}</span></div>`).join("")+`</div>`;
 const myT=myRankTitles();
 h+=`<div class="card"><h3>🎖️ 我的荣誉称号</h3><p class="dim">任一榜单前三名自动获得称号，多个称号属性可叠加。</p>`;
 h+=myT.length?myT.map(t=>`<div class="tier"><div>${titleBadge(t.name,t.cls)}<span class="dim"> ${t.board}第${t.rank}名</span><div class="m">${bonusStr(t.bonus)}</div></div></div>`).join(""):`<p class="dim">暂未上榜，继续努力！</p>`;
 const evts=(S.eventTitles||[]).map(eid=>EVENT_TITLES[eid]).filter(Boolean);
 if(evts.length)h+=evts.map(e=>`<div class="tier"><div>${titleBadge(e.name,e.cls)}<span class="dim"> ${e.desc}</span><div class="m">${bonusStr(e.bonus)}</div></div></div>`).join("");
 h+=`</div>`;m.innerHTML=h;
}
/* ============ 更多：GM后台/帮助/存档 ============ */
function rEvent(){
 const m=$("main"),p=S.player;
 const total=vipTotal(),today=nowStr().slice(0,10);
 let h=`<div class="card"><h3>🎉 活动中心</h3><p class="dim">所有活动都在这里，一目了然。</p></div>`;
 // ---- 限时活动 ----
 const midGot=(S.eventTitles||[]).includes("midautumn");
 const darinGot=gfLearned("darin"),canDarin=total>=498&&!darinGot;
 h+=`<div class="card"><h3>⏳ 限时活动</h3>
 <div class="tier"><div><div class="gold">🎑 中秋赏月</div><div class="m">限定称号 ${titleBadge("🐰中秋快乐","rt-moon")}<br>攻击+15 气血+150，可叠加</div></div>
 <button class="btn small primary" style="width:auto;margin:0" id="evtMid"${midGot?" disabled":""}>${midGot?"已领取":"领取"}</button></div>
 <div class="tier"><div><div class="gold">⚡ 神功现世</div><div class="m">累计充值满￥498 领取神级《大日焚天诀》（${total}/498）<br><span class="dim">原需👑VIP6，限时直得</span></div></div>
 <button class="btn small primary" style="width:auto;margin:0" id="evtDarin"${canDarin?"":" disabled"}>${darinGot?"已领取":(total>=498?"领取":`差￥${498-total}`)}</button></div></div>`;
 // ---- 每日活动 ----
 const wbl=wbLeft();
 const taskSt=!p.task?"未接取":(p.taskDone?"可领奖":`进行中 ${p.task.done}/${p.task.need}`);
 const al=arenaLeft();
 h+=`<div class="card"><h3>📅 每日活动</h3>
 <div class="tier"><div><div class="gold">🌍 世界BOSS</div><div class="m">远古魔龙·帝天，掉落功法秘籍/异火 · 今日剩余 <b class="gold">${wbl}</b> 次</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="home">前往</button></div>
 <div class="tier"><div><div class="gold">⚔️ 竞技场</div><div class="m">挑战高手提升排名，前三每日领奖 · 今日剩余 <b class="gold">${al}</b>/5 次</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="arena">前往</button></div>
 <div class="tier"><div><div class="gold">📜 师门任务</div><div class="m">击败10个敌人，奖300铜币+200修为 · ${taskSt}</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="sect">前往</button></div></div>`;
 // ---- 福利领取 ----
 const v=vipLevel(),vclaimed=S.vipClaim===today;
 const vSt=!v?"VIP1开启":(vclaimed?"今日已领取":"可领取");
 const fgSt=S.firstGift?"已领取":(S.orders.length?"可领取":"首充后可领");
 const giftN=GIFTS.filter(gf=>total>=gf.need&&!(S.claimedGifts||{})[gf.id]).length;
 const giftSt=giftN?`${giftN}个可领取`:"暂无可领";
 h+=`<div class="card"><h3>🎁 福利领取</h3>
 <div class="tier"><div><div class="gold">👑 每日VIP礼包</div><div class="m">${vSt}</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="pay">前往领取</button></div>
 <div class="tier"><div><div class="gold">🎁 首充礼包</div><div class="m">${fgSt} · 288元宝+2万铜币+体力+灵兽蛋</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="pay">前往领取</button></div>
 <div class="tier"><div><div class="gold">💎 充值豪礼</div><div class="m">${giftSt} · 神级宠物/稀有称号</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="pay">前往领取</button></div></div>`;
 m.innerHTML=h;
 const em=$("evtMid");
 if(em)em.onclick=()=>{S.eventTitles=S.eventTitles||[];
  if(S.eventTitles.includes("midautumn"))return;
  S.eventTitles.push("midautumn");calcStats();save();render();toast("🎑 获得限定称号「🐰中秋快乐」！");};
 const ed=$("evtDarin");
 if(ed)ed.onclick=()=>{
  if(vipTotal()<498||gfLearned("darin"))return;
  S.gongfaLearned=S.gongfaLearned||{};S.gongfaLearned.darin=1;
  calcStats();save();render();toast("⚡ 限时活动：获得神级功法《大日焚天诀》！");};
 m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{TAB=b.dataset.go;B=null;render();window.scrollTo(0,0);});
}
function rMore(){
 const m=$("main"),p=S.player;
 const total=S.orders.reduce((a,o)=>a+o.money,0);
 m.innerHTML=`<div class="card"><h3>📊 GM 后台（店主视角）</h3>
 <div class="statgrid"><div>累计充值笔数<b>${S.orders.length}</b></div><div>累计充值金额<b>￥${total}</b></div>
 <div>发放元宝总数<b>${S.orders.reduce((a,o)=>a+o.gold,0)}</b></div><div>VIP等级<b>👑VIP${vipLevel()}</b></div>
 <div>建号时间<b style="font-size:11px">${S.created}</b></div></div>
 <p class="dim" style="margin-top:8px">正式版这里会显示所有玩家的订单，并支持订单查询、补发、封号等管理功能。</p></div>
 <div class="card"><h3>❓ 玩法说明</h3><p class="dim">
 · 去「江湖」挑战敌人，升级变强<br>· 怪物掉装备，去「背包」穿戴、铁匠铺强化<br>
 · 野怪打到30%血可捕捉为宠物，宠物会帮你打架<br>
 · 🥋技能全是斗破斗技：八极崩、焰分噬浪尺、佛怒火莲、三千雷动、帝印诀等，去「门派」学习<br>
 · ⚔️竞技场：底部「竞技」页，每日5次挑战排名更高的对手，获胜排名上升；前三名每日可领元宝/铜币/灵羽<br>
 · 🤝伙伴：在「宠物」页招募（铜币/元宝），可穿戴武器护甲靴子饰品，出战后30%属性加给你，战斗胜利获得修为升级<br>
 · 🏆排行新增🦊宠物榜、🪽翅膀榜、⬆️等级榜，前三名同样获得可叠加荣誉称号<br>
 · 体力不够就打坐，或去商城买体力丹<br>
 · 「充值」是模拟的，不花真钱，随便点！首充自动赠小红剑（限时3天），另有🎁首充礼包可领（288元宝+2万铜币+体力+4阶灵兽蛋）；累计充值提升VIP等级，加攻击气血、每日领礼包<br>
 · 宠物可捕捉斗罗魂兽：柔骨兔·小舞、蓝银皇·阿银、鬼虎、人面魔蛛、泰坦巨猿·二明、暗魔邪神虎、天青牛蟒·大明、冰碧帝皇蝎<br>
 · 「排行」有战力榜和充值榜，前三名自动获得炫酷称号（属性可叠加）：👑战力之巅/⚔️武林传奇/🛡️江湖豪杰，💎神豪无双/💰富甲天下/🪙一掷千金<br>
 · 🦊宠物分黄/玄/地/天/神五级，品级越高助战越强；神级宠物、神级功法、稀有称号只能通过💎充值豪礼或⚡限时活动获得<br>
 · 🎉活动中心：⏳限时活动（中秋称号、神功现世）、📅每日活动（世界BOSS、师门任务）、🎁福利领取（VIP礼包/首充礼包/充值豪礼）都在这里<br></p></div>
 <div class="card"><h3>💾 存档</h3>
 <button class="btn small" id="resave">手动保存</button>
 <button class="btn small danger" id="reset">删号重来（清空存档）</button></div>`;
 $("resave").onclick=()=>{save();toast("已保存");};
 $("reset").onclick=()=>{
  if(confirm("确定删除存档、重新开始吗？")){localStorage.removeItem(SAVE_KEY);location.reload();}
 };
}
/* ============ 启动 ============ */
(function init(){
 S=load();
 if(S&&S.player){calcStats();TAB="home";render();}
 else{rCreate();}
 setInterval(()=>{ // 每60秒回1点体力
  if(S&&S.player&&S.player.stamina<S.player.maxStamina){S.player.stamina++;save();if(TAB==="home"&&!B)renderTop();}
 },60000);
})();
</script>
</body>
