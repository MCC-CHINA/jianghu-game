/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800);}
function modal(html){$("modalbox").innerHTML=html;$("modal").classList.add("show");}
function closeModal(){$("modal").classList.remove("show");}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
function nowStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");}

 {name:"独步天下",atk:160,hp:1600,drop:35},{name:"盖世无双",atk:230,hp:2300,drop:40},{name:"君临天下",atk:320,hp:3200,drop:45},
 {name:"天人合一",atk:450,hp:4500,drop:50},{name:"破碎虚空",atk:620,hp:6200,drop:60},{name:"武道至尊",atk:850,hp:8500,drop:70}];

<script>
"use strict";
/* ============ 存档 ============ */
const SAVE_KEY="jhx_save_v1";
let S=null, TAB="home", B=null;
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const t=localStorage.getItem(SAVE_KEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function expNeed(lv){return Math.floor(80*Math.pow(lv,1.6));}
function petExpNeed(lv){return 40*lv;}
function calcStats(){
 const p=S.player;
 p.maxhp=p.base.maxhp+(p.level-1)*18; p.maxmp=p.base.maxmp+(p.level-1)*8;
 p.atk=p.base.atk+(p.level-1)*3; p.def=p.base.def+(p.level-1)*2; p.spd=p.base.spd+(p.level-1)*1;
 p.luck=0;
 for(const slot of["weapon","armor","boots","charm"]){
 const it=S.equip[slot]; if(!it)continue; const d=ITEMS[it.iid],e=it.enh||0;
 p.atk+=d.atk||0; p.def+=d.def||0; p.hp0=(p.hp0||0); p.spd+=d.spd||0; p.luck+=(slot==="weapon"?Math.min(9,d.luck||0):(d.luck||0)); // 武器幸运最高为9
 if(d.hp)p.maxhp+=d.hp;
 if(slot==="weapon")p.atk+=e*2; if(slot==="armor")p.def+=e*2;
 if(slot==="boots")p.spd+=e*1; if(slot==="charm"){p.maxhp+=e*15;}
 }
 const wt0=wornTitleInfo(),wb=wt0?(wt0.bonus||{}):null; // 佩戴称号加成
 if(wb){p.atk+=wb.atk||0;p.maxhp+=wb.hp||0;p.luck+=wb.luck||0;p.spd+=wb.spd||0;}
 for(const[gid,lv]of Object.entries(S.gongfa||{})){const g=GONGFA[gid];if(!g||!lv)continue; // 功法加成
 for(const[k,v]of Object.entries(g.bonus)){
 if(k==="hp")p.maxhp+=v*lv;else if(k==="mp")p.maxmp+=v*lv;else p[k]=(p[k]||0)+v*lv;}}
 const dq=DOUQI[S.douqi||0]; // 斗气境界加成
 if(dq)for(const[k,v]of Object.entries(dq.bonus)){if(k==="hp")p.maxhp+=v;else if(k==="mp")p.maxmp+=v;else p[k]=(p[k]||0)+v;}
 for(const fn of(S.yihuo||[])){const f=YIHUO.find(x=>x.name===fn);if(!f)continue; // 异火加成
 for(const[k,v]of Object.entries(f.bonus)){if(k==="hp")p.maxhp+=v;else if(k==="mp")p.maxmp+=v;else p[k]=(p[k]||0)+v;}}
 const fjlv=(S.fenjue&&S.fenjue.lv)||0,fm=fenjueTier()+1; // 焚诀加成（随异火进化）
 if(fjlv){p.atk+=4*fm*fjlv;p.maxhp+=50*fm*fjlv;p.maxmp+=10*fm*fjlv;}
 const wt=(S.wing&&S.wing.tier)||0; // 翅膀加成：每阶攻击+12 气血+120 速度+3
 if(wt){p.atk+=12*wt;p.maxhp+=120*wt;p.spd+=3*wt;}
 const ap=(S.partners||[])[S.activePartner]; // 出战伙伴：将其30%属性加给玩家
 if(ap){const st=partnerStats(ap);p.atk+=Math.floor(st.atk*0.3);p.def+=Math.floor(st.def*0.3);p.maxhp+=Math.floor(st.hp*0.3);p.spd+=Math.floor(st.spd*0.3);}
 for(const t of myRankTitles()){const b=t.bonus; // 排行榜称号加成（可叠加）
 p.atk+=b.atk||0;p.def+=b.def||0;p.maxhp+=b.hp||0;p.maxmp+=b.mp||0;p.spd+=b.spd||0;p.luck+=b.luck||0;}
 for(const eid of(S.eventTitles||[])){const e=EVENT_TITLES[eid];if(!e)continue;const b=e.bonus; // 节日称号加成（可叠加）
 p.atk+=b.atk||0;p.def+=b.def||0;p.maxhp+=b.hp||0;p.maxmp+=b.mp||0;p.spd+=b.spd||0;p.luck+=b.luck||0;}
 const vb=1+vipLevel()*0.02; // VIP加成：每级攻击/气血+2%
 p.atk=Math.floor(p.atk*vb); p.maxhp=Math.floor(p.maxhp*vb);
 p.hp=Math.min(p.hp,p.maxhp); p.mp=Math.min(p.mp,p.maxmp);
}
function zhanli(){
 const p=S.player;let z=p.atk*3+p.def*2+p.maxhp*0.5+p.spd*2;
 const pet=S.pets[S.activePet]; if(pet){const b=PETS[pet.pid];z+=(b.atk*(1+0.15*(pet.level-1)))*2*(PET_TMULT[b.tier]||1);}
 return Math.floor(z);
}

 S={player:{name,sect:sectKey,level:1,exp:0,hp:sc.hp,mp:sc.mp,coins:100,gold:0,
 stamina:50,maxStamina:50,skills:[sc.skill],task:null,taskDone:false,feather:0,
 base:{maxhp:sc.hp,maxmp:sc.mp,atk:sc.atk,def:sc.def,spd:sc.spd}},
 equip:{weapon:null,armor:null,boots:null,charm:null},bag:[],pets:[],activePet:-1,wing:{tier:0},
 partners:[],activePartner:-1,arena:{rank:1000,date:"",left:5,reward:"",top:ARENA_TOP.map((n,i)=>({name:n,rank:i+1}))},
 orders:[],zone:0,created:nowStr(),wornTitle:null,gongfa:{},gongfaLearned:{},claimedGifts:{},douqi:0,yihuo:[],fenjue:{lv:0},eventTitles:[]};
 calcStats();S.player.hp=S.player.maxhp;S.player.mp=S.player.maxmp;save();
}
/* ============ 顶栏/导航 ============ */
function renderTop(){
 const p=S.player,t=$("topbar");t.style.display="block";
 const v=vipLevel();
 const wt=wornTitleInfo();
 t.innerHTML=`<div class="pname">${wt?titleBadge(wt.name,wt.cls,wt.hue):""}<span class="${v>=6?"vipn"+Math.min(v,12):""}">${p.name}</span><span class="lv">Lv.${p.level} ${SECTS[p.sect].name}</span>${v?`<span class="vip" id="topVip" title="查看VIP详情">VIP${v}</span>`:""}</div>
 <div class="bars">
 <div class="bar hp"><i style="width:${p.hp/p.maxhp*100}%"></i><span>气血 ${p.hp}/${p.maxhp}</span></div>
 <div class="bar mp"><i style="width:${p.mp/p.maxmp*100}%"></i><span>内力 ${p.mp}/${p.maxmp}</span></div>

 </div>
 <div class="wallet"><span>铜币 <b>${p.coins}</b></span><span>元宝 <b>${p.gold}</b></span><span>体力 <b>${p.stamina}/${p.maxStamina}</b></span><span>幸运 <b>${p.luck||0}</b></span><span>战力 <b>${zhanli()}</b></span></div>`;
 t.innerHTML+=`<button class="btn small primary" id="topPay">充值</button>`;
 $("topPay").onclick=()=>{TAB="pay";B=null;render();window.scrollTo(0,0);};
 const tv=$("topVip");if(tv)tv.onclick=()=>{TAB="vipinfo";B=null;render();window.scrollTo(0,0);};
}
const TABS=[["home","江湖"],["bag","背包"],["pet","宠物"],["wing","翅膀"],["partner","伙伴"],["sect","门派"],["gongfa","功法"],["shop","商店"],["rank","排行"],["title","称号"],["arena","竞技"],["event","活动"],["more","更多"]];
function renderTabs(){

 t.innerHTML=TABS.map(([k,n])=>`<button class="${TAB===k?'on':''}" data-t="${k}">${n}</button>`).join("");
 t.querySelectorAll("button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;B=null;render();});
}
function render(){if(S&&S.player&&sweepExpired())setTimeout(()=>toast(" 小红剑已到期，已自动卸下"),50);renderTop();renderTabs();
 ({home:rHome,bag:rBag,pet:rPet,sect:rSect,gongfa:rGongfa,shop:rShop,pay:rPay,rank:rRank,title:rTitle,arena:rArena,wing:rWing,partner:rPartner,event:rEvent,more:rMore,vipinfo:rVip}[TAB])();}
/* ============ 创建角色 ============ */
let selSect="shaolin";
function rCreate(){
 $("topbar").style.display="none";$("tabbar").style.display="none";
 const m=$("main");
 m.innerHTML=`<div class="card"><h3>初入江湖</h3>
 <p class="dim">欢迎来到文字武侠世界。取一个响亮的名号，选择你的门派，开始闯荡江湖吧！</p>
 <input type="text" id="cname" maxlength="8" placeholder="输入你的名字（最多8字）">
 ${Object.entries(SECTS).map(([k,v])=>`<div class="sect ${k===selSect?'sel':''}" data-s="${k}"><h4>${v.name}</h4><p>${v.desc}</p><p class="dim">初始武功：${SKILLS[v.skill].name}</p></div>`).join("")}
 <button class="btn primary" id="gobtn">踏 入 江 湖</button></div>`;
 m.querySelectorAll(".sect").forEach(d=>d.onclick=()=>{selSect=d.dataset.s;rCreate();});
 $("gobtn").onclick=()=>{

 };

 const m=$("main"),p=S.player;
 if(B){rBattle();return;}
 let h=`<div class="card"><h3>闯荡江湖</h3><p class="dim">选择区域，挑战其中的江湖人物。每次挑战消耗5点体力。</p>`;
 ZONES.forEach((z,i)=>{
 const lock=p.level<z.req;
 h+=`<div class="mob"><div><div class="mn">${z.name} </div><div class="md">${z.desc} · 建议${z.req}级+</div></div>
 <button class="btn" ${lock?'disabled':''} data-z="${i}">${lock?z.req+'级':"前往"}</button></div>`;
 });
 h+=`<button class="btn small" id="dazuo">打坐调息（+10体力）</button>
 <p class="dim">师门任务：${p.task?("已接取：击败"+p.task.need+"个敌人（"+p.task.done+"/"+p.task.need+"）"+(p.taskDone?" 可领奖":"")):"未接取，去门派接取"}</p></div>`;
 h+=`<div class="card"><h3>世界BOSS</h3><p class="dim">远古魔龙·帝天降临！战胜掉落功法秘籍（神级以下）。每日可挑战 <b class="gold">${wbLeft()}</b>次，每次消耗10点体力。</p>
 <button class="btn primary" id="wbBtn"${wbLeft()>0?"":" disabled"}>挑战世界BOSS</button></div>`;
 m.innerHTML=h;
 m.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>rZone(+b.dataset.z));
 const wb=$("wbBtn");if(wb)wb.onclick=startWBattle;
 $("dazuo").onclick=()=>{
 const now=Date.now();
 if(S.dazuoCD&&now-S.dazuoCD<60000){toast("调息中…"+Math.ceil((60000-(now-S.dazuoCD))/1000)+"秒");return;}

 };

function rZone(zi){
 const m=$("main"),z=ZONES[zi],p=S.player;
 let h=`<div class="card"><h3>${z.name}</h3><p class="dim">${z.desc}</p>`;
 z.mobs.forEach((fn,i)=>{
 const mo=fn();
 h+=`<div class="mob"><div><div class="mn">${mo.name} <span class="dim">Lv.${mo.lv}</span></div>
 <div class="md">${mo.catchPet?("可捕捉："+PETS[mo.catchPet].name+" · "):""}气血${mo.hp} 攻击${mo.atk}</div></div>
 <button class="btn" data-m="${i}">挑战</button></div>`;
 });

 $("back").onclick=()=>render();

<script>
"use strict";
/* ============ 战斗 ============ */
function startBattle(zi,mi){
const p=S.player;
if(p.stamina<5){toast("体力不足，去打坐或商城买体力丹");return;}
p.stamina-=5;
const mo=ZONES[zi].mobs[mi]();
B={zi,mi,foe:{...mo,maxhp:mo.hp},log:[],over:false};
log(`<span class="sys">你在${ZONES[zi].name}遭遇了！</span>`);
save();rBattle();
}
function log(t){B.log.push(t);}
function dmgCalc(atk,def,mult,luck){
let d=Math.max(1,(atk*(mult||1.6)-def*0.8))* (0.9+Math.random()*0.2);
const crit=Math.random()<Math.min(0.5,0.15+(luck||0)*0.01); if(crit)d*=1.6;
return{h:Math.floor(d),crit};
}
function foeTurn(){
const f=B.foe,p=S.player;
if(f.hp<=0||B.over)return;
const d=dmgCalc(f.atk,p.def,1.5);
p.hp=Math.max(0,p.hp-d.h);
log(`<span class="foe">${f.name}攻来，造成 ${d.h} 点伤害${d.crit?"（暴击！）":""}</span>`);
if(p.hp<=0){endBattle(false);return;}
petTurn();
}
function petTurn(){
const pet=S.pets[S.activePet];
if(!pet||B.over)return;
const b=PETS[pet.pid],f=B.foe;
const pa=Math.floor(b.atk*(1+0.15*(pet.level-1))*(PET_TMULT[b.tier]||1));
const d=Math.max(1,Math.floor(pa*1.2-f.def*0.5));
f.hp=Math.max(0,f.hp-d);
log(`<span class="pet">协助攻击，造成 ${d} 点伤害</span>`);
if(f.hp<=0)endBattle(true);
}
function gainExp(n){
const p=S.player;p.exp+=n;
let ups=0;
while(p.exp>=expNeed(p.level)){p.exp-=expNeed(p.level);p.level++;ups++;}
if(ups>0){calcStats();p.hp=p.maxhp;p.mp=p.maxmp;log(`<span class="sys">升级了！当前 ${p.level} 级，气血内力回满！</span>`);}
}
function gainPetExp(n){
const pet=S.pets[S.activePet];if(!pet)return;
pet.exp+=n;
while(pet.exp>=petExpNeed(pet.level)){pet.exp-=petExpNeed(pet.level);pet.level++;}
}
function endBattle(win){
B.over=true;const p=S.player,f=B.foe;
if(win){
log(`<span class="sys">战胜了！获得修为 ${f.exp}、铜币 ${f.coins}</span>`);
gainExp(f.exp);p.coins+=f.coins;gainPetExp(Math.floor(f.exp/2));gainPartnerExp(Math.floor(f.exp/2));
if(B.wb){ // 世界BOSS：掉落功法（神级以下）
 const cand=Object.keys(GONGFA).filter(g=>!["神","圣"].includes(GONGFA[g].tier)&&!gfLearned(g));
 if(cand.length){
 const w={黄:40,玄:30,地:20,天:10};let tot=0;
 const bag=cand.map(g=>{const ww=w[GONGFA[g].tier]||10;tot+=ww;return[g,ww];});
 let r=Math.random()*tot,pg=bag[0][0];
 for(const[g,ww]of bag){r-=ww;if(r<=0){pg=g;break;}}
 S.gongfaLearned=S.gongfaLearned||{};S.gongfaLearned[pg]=1;
 log(`<span class="sys">世界BOSS掉落：功法《${GONGFA[pg].name}》！去功法页修炼吧</span>`);
 }else{p.gold+=88;log(`<span class="sys">功法已集齐，获得88元宝！</span>`);}
 // 异火掉落（极低概率，VIP称号提升爆率）
 const unownedYH=YIHUO.filter(f=>!(S.yihuo||[]).includes(f.name));
 if(unownedYH.length&&Math.random()<0.03*(1+vipDrop()/100)){
 const yf=pick(unownedYH);S.yihuo=S.yihuo||[];S.yihuo.push(yf.name);
 log(`<span class="sys">天降机缘！世界BOSS掉落${yf.name}，已自动炼化！</span>`);
 }
 // 世界BOSS掉落灵羽（翅膀升阶材料）
 const fn=2+Math.floor(Math.random()*4);p.feather=(p.feather||0)+fn;
 log(`<span class="sys">世界BOSS掉落灵羽×${fn}！可在「翅膀」页升级翅膀</span>`);
}else if(B.arena){ // 竞技场：获胜提升排名
 const R=B.oppRank,A=S.arena;
 if(R<A.rank){
 for(const n of A.top)if(n.rank>=R)n.rank++;
 A.rank=R;
 log(`<span class="sys">挑战成功！竞技场排名升至第 <b>${R}</b>名！</span>`);
 }
}else{
// 掉落（VIP称号提升爆率）
const tier=ZONES[B.zi].tier;
const pool=Object.keys(ITEMS).filter(k=>ITEMS[k].tier===tier&&!ITEMS[k].gift);
if(f.boss||Math.random()<0.3*(1+vipDrop()/100)){
const iid=pick(pool);
S.bag.push({iid,enh:0});
log(`<span class="sys">获得了！</span>`);
}
}
// 充值红包掉落：散人打怪也能攒累计充值奖励进度，每日最多100个
const rpToday=nowStr().slice(0,10);
if(S.rpDay!==rpToday){S.rpDay=rpToday;S.rpDayCount=0;}
const rpRate=B.wb?0.5:(B.arena?0.2:0.06);
if((S.rpDayCount||0)<100&&Math.random()<rpRate){
 const rr=Math.random(),amt=rr<0.02?10:(rr<0.08?5:(rr<0.20?3:(rr<0.50?1:0.5)));
 rpList().push(amt);S.rpDayCount=(S.rpDayCount||0)+1;
 log(`<span class="sys">获得${amt}元充值红包×1！去充值页开启，可计入累计充值奖励</span>`);
}
if(p.task&&!p.taskDone){p.task.done++;if(p.task.done>=p.task.need){p.taskDone=true;log(`<span class="sys">师门任务完成，可回门派领奖！</span>`);}}
}else{
log(`<span class="sys">你败下阵来，被好心人救回，气血恢复…</span>`);
p.hp=1;
}
calcStats();save();
}
function rBattle(){
const m=$("main"),p=S.player,f=B.foe;
let h=`<div class="card"><h3>${f.name} ${f.boss?"":""} <span class="dim">Lv.${f.lv}</span></h3>
<div class="bar hp"><i style="width:${f.hp/f.maxhp*100}%"></i><span>${f.hp}/${f.maxhp}</span></div>
<div id="battlelog">${B.log.map(t=>`<p>${t}</p>`).join("")}</div>`;

h+=`<button class="btn primary" id="bback">继续闯荡</button></div>`;
}else{
h+=`<div class="rowbtns"><button class="btn" id="a_atk">普通攻击</button><button class="btn" id="a_med">吃药</button></div>
<div class="rowbtns">${p.skills.filter(s=>SKILLS[s]).map(s=>`<button class="btn small" data-sk="${s}">${SKILLS[s].name}(${SKILLS[s].mp}内)</button>`).join("")}</div>
<div class="rowbtns">${f.catchPet?`<button class="btn small" id="a_cap">捕捉</button>`:""}<button class="btn small danger" id="a_flee">逃跑</button></div></div>`;
}
m.innerHTML=h;

if(B.over){$("bback").onclick=()=>{B=null;TAB="home";render();};return;}
$("a_atk").onclick=()=>doAtk(null);
m.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>doAtk(b.dataset.sk));
$("a_med").onclick=()=>{
const med=S.bag.find(x=>x.use);
if(!med){toast("背包里没有药品，去商店买");return;}
if(med.use==="hp150")p.hp=Math.min(p.maxhp,p.hp+150);
if(med.use==="hp450")p.hp=Math.min(p.maxhp,p.hp+450);
if(med.use==="mpfull")p.mp=p.maxmp;
S.bag.splice(S.bag.indexOf(med),1);
log(`<span class="me">你服下了</span>`);
afterPlayer();};
const cap=$("a_cap");if(cap)cap.onclick=doCapture;
$("a_flee").onclick=()=>{
if(Math.random()<0.7){log(`<span class="sys">你成功逃脱了。</span>`);B.over=true;p.hp=Math.max(1,p.hp);save();rBattle();}
else{log(`<span class="foe">逃跑失败！</span>`);foeTurn();save();rBattle();}
};
}
function doAtk(skId){
const p=S.player,f=B.foe;
if(skId){
const sk=SKILLS[skId];

 m.innerHTML=`<div class="card"><h3>VIP称号</h3><p class="dim">点击已获得的称号进行佩戴/切换</p><div class="tgrid">${vipHtml}</div></div>`
 +`<div class="card"><h3>排行榜荣誉称号</h3><div class="tgrid">${rkHtml}</div></div>`
 +`<div class="card"><h3>限定称号</h3><div class="tgrid">${evHtml}</div></div>`;
 m.querySelectorAll("[data-wk]").forEach(s=>s.onclick=()=>{
 const k=s.dataset.wk;let id=s.dataset.wid;if(k==="vip")id=+id;
 S.wornTitle={k:k,id:id};calcStats();save();render();

function rRank(){
 const m=$("main"),zl=zhanli(),p=S.player;
 const pay=S.orders.reduce((a,o)=>a+o.money,0);
 const zlist=[...RANKS.map(r=>({...r})),{name:p.name+"（我）",zl,me:true}].sort((a,b)=>b.zl-a.zl);
 const plist=[...RANK_PAY.map(r=>({...r})),{name:p.name+"（我）",pay,me:true}].sort((a,b)=>b.pay-a.pay);
 let h=`<div class="card"><h3>武林战力榜</h3><p class="dim">我的战力：<b class="gold">${zl}</b>· 第 ${zlist.findIndex(r=>r.me)+1} 名</p>`;
 h+=zlist.map((r,i)=>`<div class="rankrow${r.me?" me":""}"><span>${i+1}. ${r.name}${i<3?` ${titleBadge(RANK_TITLES.zl[i].name,RANK_TITLES.zl[i].cls)}`:""}</span><span>${r.zl}</span></div>`).join("")+`</div>`;
 h+=`<div class="card"><h3>充值风云榜</h3><p class="dim">我的累计充值：<b class="gold">￥${pay}</b>· 第 ${plist.findIndex(r=>r.me)+1} 名</p>`;
 h+=plist.map((r,i)=>`<div class="rankrow${r.me?" me":""}"><span>${i+1}. ${r.name}${i<3?` ${titleBadge(RANK_TITLES.pay[i].name,RANK_TITLES.pay[i].cls)}`:""}</span><span>￥${r.pay}</span></div>`).join("")+`</div>`;
 // 宠物榜
 let myPetScore=0,myPetName="暂无宠物";
 for(const pet of(S.pets||[])){const sc=petScore(pet);if(sc>myPetScore){myPetScore=sc;myPetName=pet.name;}}
 const petlist=[...RANK_PET.map(r=>({...r})),{name:p.name+"（我）",pet:myPetName,score:myPetScore,me:true}].sort((a,b)=>b.score-a.score);
 h+=`<div class="card"><h3>宠物排行榜</h3><p class="dim">我的最强宠物：<b class="gold">${myPetName}</b>（评分${myPetScore}）· 第 ${petlist.findIndex(r=>r.me)+1} 名</p>`;
 h+=petlist.map((r,i)=>`<div class="rankrow${r.me?" me":""}"><span>${i+1}. ${r.name} <span class="dim">${r.pet}</span>${i<3?` ${titleBadge(RANK_TITLES.pet[i].name,RANK_TITLES.pet[i].cls)}`:""}</span><span>${r.score}</span></div>`).join("")+`</div>`;
 // 翅膀榜
 const myWing=(S.wing&&S.wing.tier)||0;
 const winglist=[...RANK_WING.map(r=>({...r})),{name:p.name+"（我）",wing:myWing?WING_NAMES[myWing]:"未激活",tier:myWing,me:true}].sort((a,b)=>b.tier-a.tier);
 h+=`<div class="card"><h3>翅膀排行榜</h3><p class="dim">我的翅膀：<b class="gold">${myWing?WING_NAMES[myWing]+`（${myWing}阶）`:"未激活"}</b>· 第 ${winglist.findIndex(r=>r.me)+1} 名</p>`;
 h+=winglist.map((r,i)=>`<div class="rankrow${r.me?" me":""}"><span>${i+1}. ${r.name} <span class="dim">${r.wing}${r.tier?`·${r.tier}阶`:""}</span>${i<3?` ${titleBadge(RANK_TITLES.wing[i].name,RANK_TITLES.wing[i].cls)}`:""}</span><span>${r.tier}阶</span></div>`).join("")+`</div>`;
 // 等级榜
 const lvlist=[...RANK_LV.map(r=>({...r})),{name:p.name+"（我）",lv:p.level,me:true}].sort((a,b)=>b.lv-a.lv);
 h+=`<div class="card"><h3>等级排行榜</h3><p class="dim">我的等级：<b class="gold">Lv.${p.level}</b>· 第 ${lvlist.findIndex(r=>r.me)+1} 名</p>`;
 h+=lvlist.map((r,i)=>`<div class="rankrow${r.me?" me":""}"><span>${i+1}. ${r.name}${i<3?` ${titleBadge(RANK_TITLES.lv[i].name,RANK_TITLES.lv[i].cls)}`:""}</span><span>Lv.${r.lv}</span></div>`).join("")+`</div>`;
 m.innerHTML=h;
}

function rEvent(){
 const m=$("main"),p=S.player;
 const total=vipTotal(),today=nowStr().slice(0,10);
 let h=`<div class="card"><h3>活动中心</h3><p class="dim">所有活动都在这里，一目了然。</p></div>`;

 h+=`<div class="card"><h3> 限时活动</h3>

 <div class="tier"><div><div class="gold">节日庆典</div><div class="m">每日可领取一个随机限定称号<br>剩余未获得：${festLeft} 个</div></div>

 <button class="btn small primary" style="width:auto;margin:0" id="evtMythic"${canMythic?"":" disabled"}>${mythicGot?"已领取":(total>=1288?"领取":`差￥${1288-total}`)}</button></div></div>`;
 // ---- 每日活动 ----
 const wbl=wbLeft();
 const taskSt=!p.task?"未接取":(p.taskDone?"可领奖":`进行中 ${p.task.done}/${p.task.need}`);
 const al=arenaLeft();
 h+=`<div class="card"><h3>每日活动</h3>
 <div class="tier"><div><div class="gold">世界BOSS</div><div class="m">远古魔龙·帝天，掉落功法秘籍/异火 · 今日剩余 <b class="gold">${wbl}</b>次</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="home">前往</button></div>
 <div class="tier"><div><div class="gold">竞技场</div><div class="m">挑战高手提升排名，前三每日领奖 · 今日剩余 <b class="gold">${al}</b>/5 次</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="arena">前往</button></div>
 <div class="tier"><div><div class="gold">师门任务</div><div class="m">击败10个敌人，奖300铜币+200修为 · ${taskSt}</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="sect">前往</button></div></div>`;
 // ---- 福利领取 ----
 const v=vipLevel(),vclaimed=S.vipClaim===today;
 const vSt=!v?"VIP1开启":(vclaimed?"今日已领取":"可领取");
 const fgSt=S.firstGift?"已领取":(S.orders.length?"可领取":"首充后可领");
 const giftN=GIFTS.filter(gf=>total>=gf.need&&!(S.claimedGifts||{})[gf.id]).length;
 const giftSt=giftN?`${giftN}个可领取`:"暂无可领";
 h+=`<div class="card"><h3>福利领取</h3>
 <div class="tier"><div><div class="gold">每日VIP礼包</div><div class="m">${vSt}</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="pay">前往领取</button></div>
 <div class="tier"><div><div class="gold">首充礼包</div><div class="m">${fgSt} · 288元宝+2万铜币+体力+灵兽蛋</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="pay">前往领取</button></div>
 <div class="tier"><div><div class="gold">充值豪礼</div><div class="m">${giftSt} · 神级宠物/稀有称号</div></div>
 <button class="btn small" style="width:auto;margin:0" data-go="pay">前往领取</button></div></div>`;
 m.innerHTML=h;
 const em=$("evtMid");
 if(em)em.onclick=()=>{S.eventTitles=S.eventTitles||[];
 if(S.eventTitles.includes("midautumn"))return;
 S.eventTitles.push("midautumn");calcStats();save();render();toast(" 获得限定称号「中秋快乐」！");};
 const ef=$("evtFest");
 if(ef)ef.onclick=()=>{if(!festCan)return;
 const eid=pick(festPool);S.eventTitles=S.eventTitles||[];S.eventTitles.push(eid);S.festClaim=festDay;
 calcStats();save();render();toast(" 节日庆典：获得限定称号「"+EVENT_TITLES[eid].name+"」！");};
 const ed=$("evtDarin");
 if(ed)ed.onclick=()=>{
 if(vipTotal()<498||gfLearned("darin"))return;
 S.gongfaLearned=S.gongfaLearned||{};S.gongfaLearned.darin=1;
 calcStats();save();render();toast(" 限时活动：获得神级功法《大日焚天诀》！");};

 if(emy)emy.onclick=()=>{
 if(vipTotal()<1288||S.claimedMythicEvent)return;

 m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{TAB=b.dataset.go;B=null;render();window.scrollTo(0,0);});
}

 $("reset").onclick=()=>{

 setInterval(()=>{ // 每60秒回1点体力

 },60000);
})();
