<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>江湖行 · 文字武侠</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#141009;color:#e8dcc0;font-family:"Songti SC","STSong","SimSun",serif;font-size:15px;line-height:1.6;min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#1a140d;box-shadow:0 0 30px rgba(0,0,0,.6)}
#topbar{position:sticky;top:0;z-index:10;background:#241b0f;border-bottom:2px solid #8a6d2f;padding:8px 86px 8px 12px}
#topbar .pname{font-size:16px;font-weight:bold;color:#f5d67b;letter-spacing:1px}
.topbtns{position:absolute;right:10px;top:8px;z-index:11;display:flex;flex-direction:column;gap:6px}
.topbtns .btn{width:auto;min-width:66px;margin:0;padding:6px 10px;font-size:13px;text-align:center}
.topbtns .mailbtn{font-size:11px;padding:4px 8px;min-width:56px}
#chatFab{position:fixed;left:max(0px,calc(50% - 260px));top:44%;z-index:10;background:#3a2c12;border:1px solid #8a6d2f;border-left:none;color:#f5d67b;font-size:12px;padding:10px 5px;border-radius:0 8px 8px 0;writing-mode:vertical-rl;letter-spacing:3px;cursor:pointer;font-family:inherit;display:none}
#chatFab.on{background:linear-gradient(180deg,#8a6d2f,#6b521f);color:#fff8e0;font-weight:bold}
#topbar .pname .lv{background:#8a6d2f;color:#141009;font-size:12px;padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:2px}
#topbar .pname .vip{background:linear-gradient(180deg,#f5d67b,#c8903c);color:#3a2a08;font-size:12px;font-weight:bold;padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:2px}
#topVip{cursor:pointer;background:rgba(20,12,4,.55);color:#f5d67b;border:1px solid #c8903c;text-shadow:0 0 8px rgba(245,214,123,.7);box-shadow:0 0 8px rgba(200,144,60,.35)}
/* VIP6+名字变色，VIP10彩虹流动 */
.vipn1{color:#a8a8a8;font-weight:bold}
.vipn2{color:#7bed9f;font-weight:bold}
.vipn3{color:#70a1ff;font-weight:bold}
.vipn4{color:#eccc68;font-weight:bold}
.vipn5{color:#ff7f50;font-weight:bold}
.vipn6{color:#ffd700;font-weight:bold;text-shadow:0 0 8px rgba(255,215,0,.7)}
.vipn7{color:#ff9f43;font-weight:bold;text-shadow:0 0 8px rgba(255,159,67,.7)}
.vipn8{color:#ff5b5b;font-weight:bold;text-shadow:0 0 8px rgba(255,91,91,.7)}
.vipn9{color:#c56cf0;font-weight:bold;text-shadow:0 0 8px rgba(197,108,240,.7)}
.vipn10{font-weight:bold;background:linear-gradient(90deg,#ff2d2d,#ff7f00,#ffe600,#2dff2d,#00e5ff,#2d7fff,#a52dff,#ffd700,#ff2d2d);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 4s linear infinite}
@keyframes rainbow{to{background-position:300% center}}
/* 神级物品：七彩流光 */
.godflow{font-weight:bold;background:linear-gradient(90deg,#ff2d2d,#ff7f00,#ffe600,#2dff2d,#00e5ff,#2d7fff,#a52dff,#ffd700,#ff2d2d);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 3s linear infinite}
.goldflow{font-weight:bold;background:linear-gradient(90deg,#fff3b0,#ffd700,#ff9d00,#ffd700,#fff3b0);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 4s linear infinite}
/* 品级色：黄白 玄蓝 地紫 天橙 神粉流光 圣金流光 至尊七彩流光 */
.ptier.黄,.tn-黄{color:#f2f2f2}
.ptier.玄,.tn-玄{color:#6db3ff}
.ptier.地,.tn-地{color:#c58fff}
.ptier.天,.tn-天{color:#ffab4a}
.ptier.神,.tn-神{font-weight:bold;background:linear-gradient(90deg,#ffd6f5,#ff8fd6,#ff4fb8,#ff8fd6,#ffd6f5);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 3s linear infinite}
.ptier.圣,.tn-圣{font-weight:bold;background:linear-gradient(90deg,#fff3b0,#ffd700,#ff9d00,#ffd700,#fff3b0);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 3s linear infinite}
.ptier.至尊,.tn-至尊{font-weight:bold;background:linear-gradient(90deg,#ff2d2d,#ff7f00,#ffe600,#2dff2d,#00e5ff,#2d7fff,#a52dff,#ffd700,#ff2d2d);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 3s linear infinite}
/* 称号页：只显示称号牌；未获得灰色未点亮 */
.tgrid{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0}
.titleart{width:100%;height:auto;display:block;border-radius:10px;margin:0 0 8px}
.tt{display:inline-block;cursor:default}
.tt.worn{outline:2px solid #f5d67b;border-radius:10px;box-shadow:0 0 10px rgba(245,214,123,.6)}
.ptier{font-size:11px;padding:1px 6px;border-radius:8px;margin-left:4px;white-space:nowrap}
.ptier{font-weight:bold}
/* 动态称号：分层神兽（背景与文字静止，双神兽独立游动） */
.wornart2{position:relative;display:inline-block;width:120px;height:40px;vertical-align:middle}
.wornart2 .wbg{position:absolute;inset:0;width:100%;height:100%;border-radius:8px}
.wornart2 .wdwrap{position:absolute;top:0;bottom:0;width:52px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.wornart2 .wdwrap.l{left:-2px}
.wornart2 .wdwrap.r{right:-2px}
.wornart2 .wdragon{width:100%;height:auto;mix-blend-mode:screen;transform-origin:50% 50%}
.wornart2 .wdl{animation:swimL 7.4s ease-in-out infinite}
.wornart2 .wdr{animation:swimR 9.3s ease-in-out -3.7s infinite}
.wornart2 .wshimmer{position:absolute;inset:0;border-radius:8px;pointer-events:none;background:radial-gradient(ellipse 26% 62% at 16% 52%,rgba(130,150,255,.16),transparent 70%),radial-gradient(ellipse 26% 62% at 84% 48%,rgba(130,150,255,.16),transparent 70%);animation:wshimmer 11s ease-in-out infinite}
.wornart2.big{display:block;width:100%;max-width:430px;height:auto;aspect-ratio:3/1;margin:6px auto 10px}
.wornart2.big .wdwrap{width:24%}
@keyframes swimL{0%,100%{transform:translate(0,0) rotate(0deg) scale(1)}22%{transform:translate(2.5px,-3.5px) rotate(2.2deg) skewY(1.2deg) scale(1.02)}48%{transform:translate(-2px,-6px) rotate(-1.6deg) skewY(-1deg) scale(1.045)}74%{transform:translate(-3px,-2px) rotate(-2.4deg) skewY(1deg) scale(1.015)}}
@keyframes swimR{0%,100%{transform:translate(0,0) rotate(0deg) scale(1.03)}28%{transform:translate(-3px,-5px) rotate(-2deg) skewY(-1.2deg) scale(1)}55%{transform:translate(2.5px,-7px) rotate(1.8deg) skewY(1deg) scale(1.05)}82%{transform:translate(3.5px,-2.5px) rotate(2.4deg) skewY(-0.8deg) scale(1.02)}}
@keyframes wshimmer{0%,100%{opacity:.45}50%{opacity:1}}
/* 静态称号牌：框图+文字，无动画 */
.tstatic{position:relative;display:inline-block;width:120px;height:40px;vertical-align:middle;overflow:hidden;border-radius:6px}
.tstatic .tsbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tstatic .tstx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;letter-spacing:2px;white-space:nowrap}
.stc-gold{background:linear-gradient(180deg,#fff8dc 0%,#ffd76a 45%,#c8932a 82%,#ffe9a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px rgba(0,0,0,.65))}
.stc-silver{background:linear-gradient(180deg,#ffffff 0%,#cfd8e3 50%,#8fa0b3 85%,#eef3f8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px rgba(0,0,0,.65))}
.stc-bronze{background:linear-gradient(180deg,#ffe9c9 0%,#e0a55c 50%,#8a5a24 85%,#ffd9a0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px rgba(0,0,0,.65))}
.stc-red{color:#ffe2c4;text-shadow:0 0 8px rgba(255,90,40,.9),0 1px 2px #000}
.stc-pink{color:#ffe6f4;text-shadow:0 0 8px rgba(255,120,200,.9),0 1px 2px #000}
.stc-blue{color:#e2f5ff;text-shadow:0 0 8px rgba(90,200,255,.9),0 1px 2px #000}
.stc-purple{color:#efe0ff;text-shadow:0 0 8px rgba(175,105,255,.9),0 1px 2px #000}
.tstatic.mini{width:86px;height:27px;border-radius:4px}
.tstatic.mini .tstx{font-size:12px;letter-spacing:1px}
.tshow{cursor:pointer}
.tt.locked .tstatic,.tt.locked .wornart2{filter:grayscale(1) brightness(.55);opacity:.7}
.tt:not(.locked){cursor:pointer}
#topbar .pname .title{color:#ffe9a8;font-size:13px;margin-right:4px;text-shadow:0 0 6px rgba(245,214,123,.6)}
.bars{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.bar{height:14px;background:#0d0a06;border:1px solid #5a4a26;border-radius:7px;overflow:hidden;position:relative;font-size:10px}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .3s}
.bar.hp>i{background:linear-gradient(90deg,#a83232,#e05a5a)}
.bar.mp>i{background:linear-gradient(90deg,#2f6da3,#5aa3e0)}
.bar.exp>i{background:linear-gradient(90deg,#7a8a2f,#c3d65a)}
.bar.rage>i{background:linear-gradient(90deg,#b36a00,#ffb43c)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;border:1px solid #5a4a26;margin-left:6px;color:#f5d67b;vertical-align:1px}
.tag.elite{border-color:#8a2be2;color:#d9a7ff}
.tag.boss{border-color:#a83232;color:#ff9a9a}
.tag.enrage{border-color:#ff5a00;color:#ffb43c}
.bstat{display:flex;gap:12px;align-items:center;margin:6px 0;font-size:12px}
.bar>span{position:absolute;left:0;right:0;top:0;text-align:center;line-height:14px;color:#fff;text-shadow:0 1px 2px #000}
.wallet{display:flex;gap:12px;margin-top:6px;font-size:13px;color:#d8c690}
.wallet b{color:#f5d67b}
#main{flex:1;padding:12px 12px 64px;overflow-x:hidden}
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#241b0f;border-top:2px solid #8a6d2f;display:flex;flex-wrap:wrap;z-index:10}
#tabbar button{flex:1 1 0;min-width:0;background:none;border:none;color:#b09a5e;font-size:13px;padding:10px 4px;font-family:inherit;cursor:pointer;white-space:nowrap}
#tabbar button.on{color:#f5d67b;background:#31250f;border-top:2px solid #f5d67b;margin-top:-2px}
.card{background:#241b0f;border:1px solid #5a4a26;border-radius:8px;padding:12px;margin-bottom:12px}
.card h3{color:#f5d67b;font-size:16px;margin-bottom:8px;letter-spacing:2px;border-bottom:1px solid #5a4a26;padding-bottom:6px}
.btn{display:block;width:100%;background:#3a2c12;border:1px solid #8a6d2f;color:#f5d67b;font-size:15px;padding:12px;border-radius:8px;margin:8px 0;font-family:inherit;cursor:pointer;letter-spacing:2px}
.btn:active{background:#54401a}
.btn.primary{background:linear-gradient(180deg,#8a6d2f,#6b521f);color:#fff8e0;font-weight:bold}
.btn.danger{border-color:#a83232;color:#e08a8a}
.btn.small{padding:8px;font-size:13px;margin:4px 0}
.btn:disabled{opacity:.4}
/* 统一按钮体系：所有按钮走 btn 基类 + 修饰类，不再写行内样式 */
.btn.autow{width:auto;margin:0}
.btn.wauto{width:auto}
.btn.tiny{padding:2px 6px;font-size:11px;margin:2px}
.btn.mt8{margin-top:8px}
.btn.reroll{width:auto;margin:0;padding:6px 12px;font-size:12px;border-color:#c8903c;color:#ffd97b}
.titlerow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#topbar .pname .vipbtn{cursor:pointer;user-select:none}
#topbar .pname .vip.cur{box-shadow:0 0 10px rgba(245,214,123,.95);outline:1px solid #ffe9a8;color:#fff6d8}
.rowbtns{display:flex;gap:8px}
.rowbtns .btn{flex:1}
.mob{display:flex;justify-content:space-between;align-items:center;background:#2c2110;border:1px solid #5a4a26;border-radius:8px;padding:10px;margin:8px 0}
.mob .mn{font-weight:bold;color:#ffe9a8}
.mob .md{font-size:12px;color:#b09a5e}
.mob .btn{width:auto;margin:0;padding:8px 16px;font-size:13px}
.mob>div:first-child{flex:1;min-width:0}
.mob .zbtns{display:flex;gap:6px;flex-shrink:0;align-items:center}
.mob .zbtns .btn{min-width:68px;text-align:center;margin:0;padding:8px 12px;font-size:13px}
#battlelog{background:#0d0a06;border:1px solid #5a4a26;border-radius:8px;padding:10px;height:260px;overflow-y:auto;font-size:14px;margin-bottom:10px}
#battlelog p{margin:4px 0}
#battlelog .me{color:#8fd694}
#battlelog .foe{color:#e08a8a}
#battlelog .sys{color:#f5d67b}
#battlelog .pet{color:#8fc3e0}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px}
.statgrid div{background:#2c2110;padding:6px 10px;border-radius:6px}
.statgrid b{color:#f5d67b;float:right}
input[type=text]{width:100%;background:#0d0a06;border:1px solid #8a6d2f;color:#f5d67b;font-size:16px;padding:12px;border-radius:8px;font-family:inherit;margin:8px 0}
.sect{border:1px solid #5a4a26;border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;background:#2c2110}
.sect.sel{border-color:#f5d67b;background:#3a2c12}
.sect h4{color:#f5d67b;font-size:16px}
.sect p{font-size:13px;color:#b09a5e}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.show{display:flex}
#modal .box{background:#241b0f;border:2px solid #8a6d2f;border-radius:12px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
#modal .box h3{color:#f5d67b;text-align:center;margin-bottom:12px;letter-spacing:3px}
.tier{border:1px solid #8a6d2f;border-radius:8px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;background:#2c2110}
.zz-frame{border:2px solid transparent;border-radius:10px;background:linear-gradient(#2c2110,#2c2110) padding-box,linear-gradient(120deg,#ff2d2d,#ff9d2d,#ffe82d,#3dff5e,#2dc4ff,#b42dff,#ff2d9d,#ff2d2d) border-box;background-size:100% 100%,300% 300%;animation:zzborder 4s linear infinite;box-shadow:0 0 14px rgba(255,180,60,.35)}
@keyframes zzborder{0%{background-position:0 0,0% 50%}50%{background-position:0 0,100% 50%}100%{background-position:0 0,0% 50%}}
.sigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.sicell{border:1px solid #8a6d2f;border-radius:8px;padding:8px 4px;text-align:center;background:#241a0c;font-size:12px}

.tier .g{color:#f5d67b;font-weight:bold;font-size:17px}
.tier .m{color:#b09a5e;font-size:13px}
.order{font-size:13px;border-bottom:1px dashed #5a4a26;padding:8px 0}
.order .ok{color:#8fd694}
.rankrow{display:flex;justify-content:space-between;padding:8px;border-bottom:1px dashed #5a4a26;font-size:14px}
.rankrow.me{color:#f5d67b;font-weight:bold}
.toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(20,14,8,.95);border:1px solid #f5d67b;color:#f5d67b;padding:14px 26px;border-radius:10px;font-size:16px;z-index:99;display:none;letter-spacing:2px}
.qrcode{width:150px;height:150px;margin:12px auto;background:repeating-linear-gradient(45deg,#e8dcc0,#e8dcc0 6px,#141009 6px,#141009 12px);border:8px solid #e8dcc0;border-radius:8px}
.paynote{text-align:center;color:#b09a5e;font-size:13px}
.center{text-align:center}
.gold{color:#f5d67b}
.dim{color:#b09a5e;font-size:13px}
.chatbox{max-height:320px;overflow-y:auto;background:rgba(0,0,0,.25);border:1px solid #3a2c1c;border-radius:8px;padding:8px;margin:8px 0}
.chatline{margin:4px 0;font-size:14px;line-height:1.5;word-break:break-all}
.chatinput{display:flex;gap:8px;margin-top:8px}

.expbuff{color:#ffd700;font-size:12px;text-align:center;margin-top:4px;font-weight:bold}

<div id="app">
 <div id="topbar" style="display:none"></div>
 <div id="main"></div>
 <div id="tabbar" style="display:none"></div>

<div id="modal"><div class="box" id="modalbox"></div></div>

<script>
"use strict";
/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800);}
function modal(html){$("modalbox").innerHTML=html;$("modal").classList.add("show");}
function closeModal(){$("modal").classList.remove("show");}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
function nowStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");}
</script>

 return o;}

 const mo=(si>=diffStages(di)-1?z.mobs[4]:z.mobs[si%4])(); // 本难度最后一小关为BOSS，其余循环前4种怪物
 const sm=D.mult*(1+si*0.12);
 mo.hp=Math.floor(mo.hp*sm);mo.atk=Math.floor(mo.atk*sm);mo.def=Math.floor(mo.def*sm);
 mo.spd=Math.floor(mo.spd*Math.pow(sm,0.15));
 mo.lv=Math.max(1,Math.round(mo.lv*Math.pow(sm,0.35))+di*3);
 mo.exp=Math.floor(mo.exp*D.xp*(1+si*0.08));
 mo.coins=Math.floor(mo.coins*D.mult*(1+si*0.08));
 mo.di=di;mo.si=si;mo.name=D.name+"·"+mo.name;
 return mo;
}
function diffUnlocked(zi,di){ // 难度解锁：普通看关卡解锁（等级+通关上一关卡普通难度），更高难度需通关上一难度最后一关
 if(di===0)return zoneUnlocked(zi);
 return !!((S.clearLog||{})[zi+":"+(di-1)+":"+(diffStages(di-1)-1)]);
}
function zoneUnlocked(zi){ // 关卡解锁：首关常开；后续关卡需等级达标且通关上一关卡普通难度全部10小关
 if(zi<=0)return true;
 if(S.player.level<ZONES[zi].req)return false;
 const cl=S.clearLog||{};
 for(let s=0;s<diffStages(0);s++)if(!cl[(zi-1)+":0:"+s])return false;
 return true;
}
function zoneLockReason(zi){ // 未解锁原因
 if(S.player.level<ZONES[zi].req)return ZONES[zi].req+"级";
 return "通关「"+ZONES[zi-1].name+"」普通难度";
}
function stageUnlocked(zi,di,si){ // 小关逐关解锁
 if(si===0)return true;
 return !!((S.clearLog||{})[zi+":"+di+":"+(si-1)]);
}
function diffProgress(zi,di){
 let n=0;const cl=S.clearLog||{};
 for(let s=0;s<diffStages(di);s++)if(cl[zi+":"+di+":"+s])n++;
 return n;
}

规则：游戏内不提供直接充值，玩家凭后台生成的兑换码兑换元宝。
兑换码格式 XXXX-XXXX-XXXX：首字符为档位(A~F对应TIERS 0~5)+5位随机码+6位签名。
签名密钥写在前端代码中，可防普通玩家伪造；如需银行级安全需后端服务。 */
const CD_A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const CD_SECRET="jhMcc2026#X7q2";
function cyrb53(str,seed){seed=seed||0;var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function cdSig(payload,account){var L=CD_A.length,h=cyrb53(CD_SECRET+"|"+payload+"|"+String(account||"").toUpperCase()),s="";for(var i=0;i<6;i++){s+=CD_A[h%L];h=Math.floor(h/L);}return s;}
function cdVerify(code,account){var raw=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(raw.length!==12)return -1;var p=raw.slice(0,6);if(cdSig(p,account)!==raw.slice(6))return -1;var tier=CD_A.indexOf(p[0]);return(tier>=0&&tier<TIERS.length)?tier:-1;}
function newAccount(){return "JH"+String(Math.floor(100000+Math.random()*900000));}
function cdNorm(code){return String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");}

function pickPartner(t,s,used){
 const match=e=>e.tier===t&&(s===undefined||s===null||e.sub===s);
 let pool=Object.keys(PARTNERS).filter(pid=>match(PARTNERS[pid])&&!(used||[]).includes(pid));
 if(!pool.length)pool=Object.keys(PARTNERS).filter(pid=>match(PARTNERS[pid]));
 if(!pool.length)pool=Object.keys(PARTNERS).filter(pid=>PARTNERS[pid].tier===t);
 const pid=pick(pool),b=PARTNERS[pid];return{pid,name:b.name,tier:b.tier,sub:b.sub,desc:b.desc};
}

 s.atk+=d.atk||0;s.def+=d.def||0;s.hp+=d.hp||0;s.spd+=d.spd||0;s.luck+=d.luck||0;
 const bo=it.bonus||{};s.atk+=bo.atk||0;s.def+=bo.def||0;s.hp+=bo.hp||0;s.spd+=bo.spd||0;s.luck+=bo.luck||0; // 武器随机属性

 else if(bs==="boots")s.spd+=e*1;else if(bs==="charm")s.hp+=e*15;}
 return s;
}

<script>

function expNeed(lv){return Math.floor(1000*(lv+1)+300*lv*(lv-1));} // 升级经验递增：1→2级需2000修为，等级越高所需越多
function petExpNeed(lv){return 240*lv;} // 怪物修为整体提高6倍，宠物升级需求同步
function calcStats(){
 const p=S.player;
 p.maxhp=p.base.maxhp+(p.level-1)*18; p.maxmp=p.base.maxmp+(p.level-1)*8;
 p.atk=p.base.atk+(p.level-1)*3; p.def=p.base.def+(p.level-1)*2; p.spd=p.base.spd+(p.level-1)*1;
 p.luck=0;p.luckW=0;p.luckN=0; // 幸运只来自武器(最高7)与项链(最高2)
 for(const slot of SLOTS){
 const it=S.equip[slot]; if(!it)continue; const d=ITEMS[it.iid],e=it.enh||0;
 p.atk+=d.atk||0; p.def+=d.def||0; p.hp0=(p.hp0||0); p.spd+=d.spd||0;
 const bo=it.bonus||{};
 if(slot==="weapon"){p.luckW=Math.min(7,(d.luck||0)+(bo.luck||0));p.luck+=p.luckW;} // 武器幸运最高7（含洗炼随机属性）
 else if(slot==="necklace"){p.luckN=Math.min(2,(d.luck||0)+(bo.luck||0));p.luck+=p.luckN;} // 项链幸运最高2（含洗炼随机属性），其余部位不加幸运
 p.atk+=bo.atk||0;p.def+=bo.def||0;p.spd+=bo.spd||0;if(bo.hp)p.maxhp+=bo.hp; // 武器随机属性（幸运已在上方计入封顶）
 if(d.hp)p.maxhp+=d.hp;
 const bs=baseSlot(slot); // 强化加成（按部位）
 if(bs==="weapon")p.atk+=e*2; else if(bs==="armor"||bs==="hat")p.def+=e*2;
 else if(bs==="pants")p.maxhp+=e*10; else if(bs==="bracer"||bs==="ring"||bs==="necklace")p.atk+=e*1;
 else if(bs==="medal")p.def+=e*1; else if(bs==="boots")p.spd+=e*1; else if(bs==="charm")p.maxhp+=e*15;
 }
 if(p.prof==="warrior")p.atk=Math.floor(p.atk*1.1);
 else if(p.prof==="mage")p.maxmp=Math.floor(p.maxmp*1.3);
 else if(p.prof==="archer")p.spd=Math.floor(p.spd*1.15);
 const setCnt={}; // 套装加成：3件攻击+5%/6件攻击+10%气血+10%/9件攻击+15%气血+15%防御+10%

 let sAtk=0,sHp=0,sDef=0;const sNames=[];
 for(const[sn,n]of Object.entries(setCnt)){
  if(n>=9){sAtk+=0.15;sHp+=0.15;sDef+=0.10;sNames.push(`${sn}${n}件`);}
  else if(n>=6){sAtk+=0.10;sHp+=0.10;sNames.push(`${sn}${n}件`);}
  else if(n>=3){sAtk+=0.05;sNames.push(`${sn}${n}件`);}
 }
 if(sAtk)p.atk=Math.floor(p.atk*(1+sAtk));
 if(sHp)p.maxhp=Math.floor(p.maxhp*(1+sHp));
 if(sDef)p.def=Math.floor(p.def*(1+sDef));
 p.setDesc=sNames.length?`套装[${sNames.join("] [")}]生效中`:"";
 const wt0=wornTitleInfo(),wb=wt0?(wt0.bonus||{}):null; // 佩戴称号加成
 if(wb){p.atk+=wb.atk||0;p.maxhp+=wb.hp||0;p.spd+=wb.spd||0;} // 称号不加幸运
 for(const[gid,lv]of Object.entries(S.gongfa||{})){const g=GONGFA[gid];if(!g||!lv)continue; // 功法加成
 for(const[k,v]of Object.entries(g.bonus)){
 if(k==="hp")p.maxhp+=v*lv;else if(k==="mp")p.maxmp+=v*lv;else if(k!=="luck")p[k]=(p[k]||0)+v*lv;}} // 功法不加幸运
 const dq=DOUQI[S.douqi||0]; // 斗气境界加成
 if(dq)for(const[k,v]of Object.entries(dq.bonus)){if(k==="hp")p.maxhp+=v;else if(k==="mp")p.maxmp+=v;else if(k!=="luck")p[k]=(p[k]||0)+v;} // 斗气不加幸运
 for(const fn of(S.yihuo||[])){const f=YIHUO.find(x=>x.name===fn);if(!f)continue; // 异火加成
 for(const[k,v]of Object.entries(f.bonus)){if(k==="hp")p.maxhp+=v;else if(k==="mp")p.maxmp+=v;else if(k!=="luck")p[k]=(p[k]||0)+v;}} // 异火不加幸运
 const fjlv=(S.fenjue&&S.fenjue.lv)||0,fm=fenjueTier()+1; // 焚诀加成（随异火进化）
 if(fjlv){p.atk+=4*fm*fjlv;p.maxhp+=50*fm*fjlv;p.maxmp+=10*fm*fjlv;}
 const wt=(S.wing&&S.wing.tier)||0; // 翅膀加成：每阶攻击+12 气血+120 速度+3
 if(wt){p.atk+=12*wt;p.maxhp+=120*wt;p.spd+=3*wt;}
 const ap=S.player.level>=5?(S.partners||[])[S.activePartner]:undefined; // 出战伙伴（需5级）：将其30%属性加给玩家
 if(ap){const st=partnerStats(ap);p.atk+=Math.floor(st.atk*0.3);p.def+=Math.floor(st.def*0.3);p.maxhp+=Math.floor(st.hp*0.3);p.spd+=Math.floor(st.spd*0.3);}
 for(const t of myRankTitles()){const b=t.bonus; // 排行榜称号加成（可叠加，称号不加幸运）
 p.atk+=b.atk||0;p.def+=b.def||0;p.maxhp+=b.hp||0;p.maxmp+=b.mp||0;p.spd+=b.spd||0;}
 for(const eid of(S.eventTitles||[])){const e=EVENT_TITLES[eid];if(!e)continue;const b=e.bonus; // 节日称号加成（可叠加，称号不加幸运）

 p.hp=Math.min(p.hp,p.maxhp); p.mp=Math.min(p.mp,p.maxmp);
}

<script>
"use strict";
/* ============ 战斗 ============ */
function startBattle(zi,di,si){
const p=S.player;
if(!zoneUnlocked(zi)){toast("「"+ZONES[zi].name+"」尚未解锁："+zoneLockReason(zi));return;}
if(p.stamina<3){toast("体力不足，去打坐或商城买体力丹");return;}
p.stamina-=3;
const mo=zoneMob(zi,di,si);mo.exp=zoneMobExp(zi,mo);
// 精英怪：12%概率（BOSS除外），属性×1.4，修为铜币×2
if(!mo.boss&&Math.random()<0.12){mo.name="精英·"+mo.name;mo.hp=Math.floor(mo.hp*1.4);mo.atk=Math.floor(mo.atk*1.4);mo.def=Math.floor(mo.def*1.4);mo.exp*=2;mo.coins*=2;mo.elite=true;}
B={zi,di,si,foe:{...mo,maxhp:mo.hp,skillCd:3+Math.floor(Math.random()*2)},log:[],over:false,round:0,combo:0,rage:0,guard:false};
log(`<span class="sys">你在${ZONES[zi].name}·${DIFFS[di].name}第${si+1}关遭遇了${mo.elite?"精英怪":"强敌"}！战场特性【${ZONE_FX[zi].name}】：${ZONE_FX[zi].desc}</span>`);
save();rBattle();
}
function log(t){B.log.push(t);}
function dmgCalc(atk,def,mult,luck,critB){
let d=Math.max(1,(atk*(mult||1.6)-def*0.8))* (0.9+Math.random()*0.2);
const crit=Math.random()<Math.min(0.5,0.15+(luck||0)*0.01+(critB||0)); if(crit)d*=1.6;
return{h:Math.floor(d),crit};
}
/* 区域战场特性结算（仅闯荡江湖）。返回true表示战斗已结束 */
function zoneTick(){
const f=B.foe,p=S.player,zi=B.zi;
if(zi===0&&B.round>0&&B.round%3===0){const rh=Math.floor(p.maxhp*0.05);p.hp=Math.min(p.maxhp,p.hp+rh);log(`<span class="sys">【${ZONE_FX[0].name}】清风拂面，恢复气血 ${rh}</span>`);}
if(zi===2){
 const ph=Math.max(1,Math.floor(p.maxhp*0.01));p.hp=Math.max(1,p.hp-ph);
 const fh=Math.max(1,Math.floor(f.maxhp*(f.boss?0.005:0.01)));f.hp=Math.max(1,f.hp-fh);
 log(`<span class="sys">【${ZONE_FX[2].name}】瘴气侵蚀，你损失 ${ph} 气血，${f.name}损失 ${fh} 气血</span>`);
}
if(zi===6&&p.mp<p.maxmp){const rmp=Math.floor(p.maxmp*0.03);p.mp=Math.min(p.maxmp,p.mp+rmp);log(`<span class="sys">【${ZONE_FX[6].name}】仙泽灵气，恢复内力 ${rmp}</span>`);}
return B.over;
}
function foeTurn(){
const f=B.foe,p=S.player;
if(f.hp<=0||B.over)return;
if(B.wb){B.wbround=(B.wbround||0)+1;
 if(B.wbround>30){log(`<span class="sys">30回合已到，世界BOSS战结束！本场共造成 ${B.wbdmg||0} 点伤害</span>`);endBattle(false);return;}}
const zone=!B.wb&&!B.arena&&B.zi!==undefined;
if(zone&&zoneTick())return;
// BOSS狂暴：血量低于30%时攻击+30%、防御-20%
if(zone&&f.boss&&!f.enraged&&f.hp<f.maxhp*0.3){
 f.enraged=true;f.atk=Math.floor(f.atk*1.3);f.def=Math.floor(f.def*0.8);
 log(`<span class="foe">【狂暴】${f.name}狂性大发，攻击暴涨、防御下降！速战速决！</span>`);}
// 怪物技能：每4回合一次，提前一回合预警
let mult=1.5,skillName=null;
if(zone){
 if(f.warned){
  f.warned=false;f.skillCd=4;skillName=f.warnName;
  mult=f.boss?(f.enraged?2.7:2.4):(f.elite?2.2:2.0);
 }else{
  f.skillCd=(f.skillCd||3)-1;
  if(f.skillCd<=0){f.warned=true;
   f.warnName=pick(f.boss?BOSS_SKILLS:(FOE_SKILLS[B.zi]||FOE_SKILLS[0]));
   log(`<span class="foe">【预警】${f.name}正在蓄力，下一回合将释放「${f.warnName}」！可防御或吃药应对</span>`);}
 }
}
const pdef=(zone&&B.zi===5)?Math.floor(p.def*1.15):p.def; // 极北冰原极寒冰封：玩家防御+15%
const d=dmgCalc(f.atk,pdef,mult);
let hurt=d.h;
if(zone&&B.zi===1)hurt=Math.floor(hurt*1.12); // 黑风寨险要地形
if(zone&&B.zi===4)hurt=Math.floor(hurt*1.1); // 熔岩炼狱地火狂暴：怪物伤害+10%
if(zone&&B.zi===7&&!d.crit&&Math.random()<0.1){hurt=Math.floor(hurt*1.6);d.crit=true;} // 九幽魔域魔气侵蚀：怪物暴击率+10%

function autoRound(){
 if(!autoOn||!B||B.over)return;
 const p=S.player;
 if((B.rage||0)>=100){doUlt();return;}
 if(p.hp<p.maxhp*0.35){
  const med=S.bag.find(x=>x.use==="hp150"||x.use==="hp450");

 }
 doAutoAtk();
}
function drinkPotion(med){
 const p=S.player;
 B.combo=0;
 if(med.use==="hp150")p.hp=Math.min(p.maxhp,p.hp+150);
 if(med.use==="hp450")p.hp=Math.min(p.maxhp,p.hp+450);
 S.bag.splice(S.bag.indexOf(med),1);

}
function bestSkill(){
 const p=S.player;let best=null,bm=0;
 for(const id of(p.skills||[])){const sk=SKILLS[id];if(!sk)continue;
  if(p.mp>=sk.mp&&sk.mult>bm){best=id;bm=sk.mult;}}
 return best;
}
function doAutoAtk(){
 const sk=bestSkill();
 doAtk(sk);
 if(sk)toast("施展「"+SKILLS[sk].name+"」！");
}
function doAtk(skId,isUlt){
const p=S.player,f=B.foe;
const zone=!B.wb&&!B.arena&&B.zi!==undefined;
let mult,critB=0,act;
if(isUlt){ // 怒气必杀：3.2倍，不耗内力
 mult=3.2;act=`必杀·${ULT[p.prof||"warrior"]}`;B.rage=0;
}else if(skId){
 const sk=SKILLS[skId];
 if(p.mp<sk.mp){toast("内力不足");return;}
 p.mp-=sk.mp;mult=sk.mult;act=`「${sk.name}」`;
}else{mult=1.6;act="挥剑斩去";}
B.round=(B.round||0)+1;
if(zone&&B.zi===3)critB=0.1; // 华山之巅剑意：暴击率+10%
const cb=1+Math.min(0.3,(B.combo||0)*0.02); // 连击加成：每层+2%，上限+30%
const zoneDmg=(zone&&B.zi===4)?1.1:1; // 熔岩炼狱地火狂暴：玩家伤害+10%
const d=dmgCalc(p.atk,f.def,mult*cb*zoneDmg,p.luck,critB);
f.hp=Math.max(0,f.hp-d.h);if(B.wb)B.wbdmg=(B.wbdmg||0)+d.h;
B.combo=(B.combo||0)+1;
if(!isUlt)B.rage=Math.min(100,(B.rage||0)+10); // 出手：连击+1，怒气+10（必杀不回怒）
log(`<span class="me">你使出${act}，造成 ${d.h} 点伤害${d.crit?"（暴击！）":""}${B.combo>1?`（连击x${B.combo}）`:""}</span>`);
if(B.rage>=100)log(`<span class="sys">怒气已满！可释放必杀·${ULT[p.prof||"warrior"]}！</span>`);
const apt=S.player.level>=5?(S.partners||[])[S.activePartner]:undefined;
if(apt&&f.hp>0&&!B.over){
 const psks=skillIdsOf(apt);
 if(psks.length&&Math.random()<0.2){
  const sd=SKILL_DEF[pick(psks)];
  const pstat=partnerStats(apt);
  const pbd=Math.max(1,Math.floor(pstat.atk*skillAtkMult(apt)*(0.5+0.25*sd.tier)));
  f.hp=Math.max(0,f.hp-pbd);if(B.wb)B.wbdmg=(B.wbdmg||0)+pbd;
  log(`<span class="pet">伙伴${apt.name}施展「${tieredName(sd.name,sd.tier)}」，额外造成 ${pbd} 点伤害！</span>`);
 }
}
if(f.hp<=0){endBattle(true);}else{foeTurn();}
save();rBattle();
}
function doUlt(){
if((B.rage||0)<100){toast("怒气未满（"+(B.rage||0)+"/100）");return;}
doAtk(null,true);
}
function doDefend(){
B.guard=true;B.round=(B.round||0)+1;B.combo=0; // 防御打断连击
log(`<span class="me">你凝神戒备，摆出防御姿态（本回合受到伤害-60%，恢复10%内力）</span>`);
foeTurn();save();rBattle();
}
function afterPlayer(){const f=B.foe;if(f.hp<=0){endBattle(true);}else{foeTurn();}save();rBattle();}
function doCapture(){
const f=B.foe;
if(f.hp>f.maxhp*0.3){toast("先把它打到30%以下血量再捕捉");return;}
if(Math.random()<0.6){
const pid=f.catchPet,b=PETS[pid];
S.pets.push(mkPet(pid,f.lv));
if(S.activePet===-1&&S.player.level>=10)S.activePet=0;
log(`<span class="sys">捕捉成功！加入了你的队伍！</span>`);
B.over=true;save();rBattle();
}else{log(`<span class="foe">捕捉失败，它挣脱了！</span>`);foeTurn();save();rBattle();}
}

/* 丹药/材料叠加（顶层，供全游戏调用） */
function addConsumable(name,use,n){ // 丹药/材料叠加，每组上限99
 n=n||1;
 while(n>0){
  let st=S.bag.find(x=>x.use===use&&!x.iid&&(x.n||0)<99);
  if(!st){st={name,use,n:0};S.bag.push(st);}
  const add=Math.min(99-(st.n||0),n);
  st.n=(st.n||0)+add;n-=add;
 }
}
function takeConsumable(use){ // 消耗1个，返回是否成功
 const ix=S.bag.findIndex(x=>x.use===use&&!x.iid);
 if(ix<0)return false;
 const it=S.bag[ix],n=(it.n||1)-1;
 if(n<=0)S.bag.splice(ix,1);else it.n=n;
 return true;
}

const SYNTH_RATE=[0.8,0.7,0.6,0.5,0.4,0.3]; // 黄->玄 ... 圣->至尊 成功率
const SYNTH_STONE={3:["evostone","神级进化石"],4:["evo_saint","圣级进化石"],5:["evo_zun","至尊进化石"]}; // 高阶合成所需进化石：商城有售（神1999/圣19999/至尊29999元宝），世界BOSS也掉落（至尊石概率极低）
function countItem(use){return S.bag.filter(x=>x.use===use&&!x.iid).reduce((a,x)=>a+(x.n||1),0);}
function synthCount(t){return S.pets.filter((pet,i)=>PETS[pet.pid].tier===t&&i!==S.activePet).length;}
function sortIdxByTier(arr,infoOf){ // 显示用排序：品级降序（至尊第一），同品级按档降序，再按等级降序；只返回下标，原数组不动
 return arr.map((_,i)=>i).sort((a,b)=>{
  const A=infoOf(arr[a]),B=infoOf(arr[b]);

function hashStr(s){let h=0;s=String(s);for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
const NPC_PETS=["啸天虎","碧鳞蛇","金翅雕","金蚕蛊","苍原狼","月影兔","灵羽鸡","泰坦巨猿","天青牛蟒","九幽冥雀"];
const NPC_TITLES=["武林新秀","一方豪杰","江湖名宿","绝世高手","武林神话","独步天下","剑啸江湖","笑傲群雄"];
const NPC_EQPRE=["铁","精钢","银","金","龙纹","轩辕"];
const NPC_EQN={weapon:"剑",hat:"盔",armor:"甲",pants:"裤",bracer:"护腕",ring:"戒",necklace:"项链",medal:"勋章",boots:"靴",charm:"带"};
function npcProfile(name,ref){
 ref=ref||{};const h=hashStr(name);
 const power=ref.zl||(ref.pay||0)*1.2||(ref.score||0)*10||((ref.tier||1)*9000)||(ref.lv||20)*900||8000;
 const f=0.9+(h%20)/100,profs=Object.keys(PROFS);
 return {name,vip:ref.vip||(h%6),lv:ref.lv||(20+h%70),prof:profs[h%3],
  zl:Math.round(ref.zl||power),
  atk:Math.round(power*0.016*f),def:Math.round(power*0.011*f),
  maxhp:Math.round(power*0.85*f),spd:Math.round(power*0.007*f),
  pet:NPC_PETS[h%NPC_PETS.length],wingT:1+h%12,title:NPC_TITLES[h%NPC_TITLES.length],
  eqTier:1+Math.min(5,Math.floor(power/25000)),gfPick:h%(Object.keys(GONGFA).length)};
}
function npcEquip(np){
 const pre=NPC_EQPRE[np.eqTier-1]||"铁",o={};
 for(const s of["weapon","hat","armor","pants","bracer1","bracer2","ring1","ring2","necklace","medal","boots","charm"]){
  const base=s.replace(/[12]$/,"");o[s]=pre+NPC_EQN[base];}
 return o;
}
function npcGongfa(np){
 const ks=Object.keys(GONGFA),n=1+(hashStr(np.name)%3),o=[];
 for(let i=0;i<n;i++)o.push(GONGFA[ks[(np.gfPick+i*7)%ks.length]].name);
 return [...new Set(o)];
}
function myBestPetName(){let s=0,n="暂无宠物";for(const pet of(S.pets||[])){const sc=petScore(pet);if(sc>s){s=sc;n=pet.name;}}return n;}
function myEquipStr(){
 const o=[];
 for(const s of SLOTS){const it=S.equip[s];if(it&&ITEMS[it.iid])o.push(SLOTNAME[s]+"："+itemNameHTML(it));}
 return o.length?o.join(" · "):"暂无装备";
}
function myGongfaStr(){
 const ks=Object.keys(S.gongfaLearned||{}).filter(g=>GONGFA[g]);
 return ks.length?ks.map(g=>GONGFA[g].name).join(" · "):"暂无功法";
}
function eqGfRows(eqObj,gfArr){
 let eqs=[];
 for(const s of SLOTS){if(eqObj[s])eqs.push(SLOTNAME[s]+"："+escHtml(eqObj[s]));}
 return `<div class="tier"><div><div class="m">装备</div><div class="gold" style="font-size:13px;line-height:1.7">${eqs.length?eqs.join(" · "):"暂无装备"}</div></div></div>`
  +`<div class="tier"><div><div class="m">功法</div><div class="gold" style="font-size:13px;line-height:1.7">${gfArr.length?gfArr.map(escHtml).join(" · "):"暂无功法"}</div></div></div>`;
}
function cmpRow(label,nv,pv){
 const hc=nv>pv?"good":nv<pv?"bad":"",pc=pv>nv?"good":pv<nv?"bad":"",d=nv-pv;
 return `<div class="tier"><div><div class="m">${label}</div><div class="gold"><span class="${hc}">${nv}</span> <span class="dim">vs</span> <span class="${pc}">${pv}</span></div><div class="m dim">${d===0?"双方持平":d>0?"对方高 "+d:"你高 "+(-d)}</div></div></div>`;
}
function viewProfile(r){
 const p=S.player,me=!!r.me;
 const np=r._prof||(me?null:npcProfile(r.name,r));
 const myVip=vipLevel(),myZl=zhanli();
 let h=`<div class="card"><h3>${me?"我的档案":"玩家档案"}</h3>`;
 if(me){
  h+=`<p>名字：${vipName(p.name,myVip)} <span class="dim">VIP${myVip}</span></p><p class="dim">${PROFS[p.prof||"warrior"].name} · Lv.${p.level}</p>`;
  h+=cmpRow("战力",myZl,myZl)+cmpRow("攻击",p.atk,p.atk)+cmpRow("防御",p.def,p.def)+cmpRow("气血",p.maxhp,p.maxhp)+cmpRow("速度",p.spd,p.spd);
  h+=`<div class="tier"><div><div class="m">装备</div><div class="gold" style="font-size:13px;line-height:1.7">${myEquipStr()}</div></div></div>`
   +`<div class="tier"><div><div class="m">功法</div><div class="gold" style="font-size:13px;line-height:1.7">${myGongfaStr()}</div></div></div>`;
 }else{
  const ratio=np.zl/Math.max(1,myZl);
  h+=`<p>名字：${vipName(np.name,np.vip)} <span class="dim">VIP${np.vip}</span></p><p class="dim">${PROFS[np.prof].name} · Lv.${np.lv} · 称号${escHtml(np.title)}</p>`;
  h+=`<p>${ratio>=1?`对方战力约为你的 <b class="bad">${ratio.toFixed(1)}</b> 倍，再接再厉！`:`你的战力已是对方的 <b class="good">${(1/ratio).toFixed(1)}</b> 倍！`}</p>`;
  h+=cmpRow("战力",np.zl,myZl)+cmpRow("等级",np.lv,p.level)+cmpRow("攻击",np.atk,p.atk)+cmpRow("防御",np.def,p.def)+cmpRow("气血",np.maxhp,p.maxhp)+cmpRow("速度",np.spd,p.spd);
  h+=`<div class="tier"><div><div class="m">宠物 / 翅膀</div><div class="gold">${escHtml(np.pet)} <span class="dim">vs</span> ${escHtml(myBestPetName())}</div><div class="m dim">${WING_NAMES[np.wingT]} <span class="dim">vs</span> ${(S.wing&&S.wing.tier)?WING_NAMES[S.wing.tier]:"未激活"}</div></div></div>`;
  h+=eqGfRows(npcEquip(np),npcGongfa(np));
 }
 h+=`<button class="btn mt8" id="vpClose">关闭</button></div>`;
 modal(h);
 $("vpClose").onclick=closeModal;
}

 h+=zlist.map((r,i)=>`<div class="rankrow${r.me?" me":""}"><span>${i+1}. <span class="vplink" data-b="zl" data-i="${i}">${vipName(r.name,r.me?vipLevel():(r.vip||0))}</span>${i<3?` ${titleArtHTML(RANK_TITLES.zl[i].name,RANK_TITLES.zl[i].cls,0,true)}`:""}</span><span>${r.zl}</span></div>`).join("")+`</div>`;
 h+=`<div class="card"><h3>充值风云榜</h3><p class="dim">我的累计充值：<b class="gold">￥${pay}</b>· 第 ${plist.findIndex(r=>r.me)+1} 名</p>`;

 // 翅膀榜

 h+=`<div class="card"><h3>翅膀排行榜</h3><p class="dim">我的翅膀：<b class="gold">${myWing?WING_NAMES[myWing]+`（${myWing}阶）`:"未激活"}</b>· 第 ${winglist.findIndex(r=>r.me)+1} 名</p>`;
 h+=winglist.map((r,i)=>`<div class="rankrow${r.me?" me":""}"><span>${i+1}. <span class="vplink" data-b="wing" data-i="${i}">${vipName(r.name,r.me?vipLevel():(r.vip||0))}</span> <span class="dim">${r.wing}${r.tier?`·${r.tier}阶`:""}</span>${i<3?` ${titleArtHTML(RANK_TITLES.wing[i].name,RANK_TITLES.wing[i].cls,0,true)}`:""}</span><span>${r.tier}阶</span></div>`).join("")+`</div>`;
 // 等级榜
 const lvlist=[{name:p.name+"（我）",lv:p.level,me:true}];

 h+=lvlist.map((r,i)=>`<div class="rankrow${r.me?" me":""}"><span>${i+1}. <span class="vplink" data-b="lv" data-i="${i}">${vipName(r.name,r.me?vipLevel():(r.vip||0))}</span>${i<3?` ${titleArtHTML(RANK_TITLES.lv[i].name,RANK_TITLES.lv[i].cls,0,true)}`:""}</span><span>Lv.${r.lv}</span></div>`).join("")+`</div>`;

}

function pushChat(ch,msg){
 const c=S.chat||(S.chat={world:[],sect:[],ch:"world",cd:0});
 (c[ch]=c[ch]||[]).push(msg);
 if(c[ch].length>60)c[ch]=c[ch].slice(-60);
 save();
}
function npcChat(ch){
 const pool=CHAT_WORLD;
 const npc=pick(CHAT_NPCS);
 pushChat(ch,{n:npc.n,vip:npc.vip,t:Date.now(),txt:pick(pool)});
}
function chatLine(m){
 const t=new Date(m.t||Date.now());
 const ts=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
 if(m.sys)return `<p class="chatline"><span class="sys">[系统 ${ts}] ${escHtml(m.txt)}</span></p>`;
 return `<p class="chatline"><span class="dim">[${ts}]</span> <span class="vplink" data-cn="${escHtml(m.n)}" data-cv="${m.vip||0}" data-me="${m.me?1:0}">${vipName(m.n,m.vip)}</span>：${escHtml(m.txt)}</p>`;
}
function sendChat(){
 const p=S.player,c=S.chat,inp=$("chatIn"),txt=(inp.value||"").trim();
 if(!txt){toast("先写点什么吧");return;}
 const now=Date.now();
 if(c.cd&&now-c.cd<5000){toast("发言太快，"+Math.ceil((5000-(now-c.cd))/1000)+"秒后再试");return;}
 c.cd=now;
 pushChat(c.ch||"world",{n:p.name,vip:vipLevel(),t:now,txt:txt.slice(0,60),me:1});
 if(Math.random()<0.65)setTimeout(()=>{try{npcChat(c.ch||"world");if(TAB==="chat")render();}catch(e){}},1200);
 render();
}
function rChat(){
 const m=$("main"),p=S.player,c=S.chat;
 if(Math.random()<0.45)npcChat(c.ch||"world");
 const ch=c.ch||"world",msgs=c[ch]||[];
 let h=`<div class="card"><h3>江湖聊天</h3><div class="rowbtns"><button class="btn small primary" id="chW">世界</button></div><div class="chatbox" id="chatbox">${msgs.map(chatLine).join("")||'<p class="dim">暂无消息，来说第一句吧</p>'}</div><div class="chatinput"><input id="chatIn" maxlength="60" placeholder="说点什么…（5秒一条）"><button class="btn primary wauto" id="chatSend">发送</button></div><p class="dim">世界频道畅所欲言。VIP名字会显示专属颜色；点击排行榜/聊天/竞技场中的玩家名字可查看档案，直观对比差距；</p></div>`;
 m.innerHTML=h;
 const box=$("chatbox");box.scrollTop=box.scrollHeight;
 $("chW").onclick=()=>{c.ch="world";save();render();};
 m.querySelectorAll("[data-cn]").forEach(el=>el.onclick=()=>viewProfile({name:el.dataset.cn,vip:+el.dataset.cv||0,me:el.dataset.me==="1"}));
 $("chatSend").onclick=sendChat;
 $("chatIn").onkeydown=e=>{if(e.key==="Enter")sendChat();};
}

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
/* 初始技能分配：每只3个，品级不高于自身（最高神级），第1个为次高品级、后2个为自身品级，同宠/同人固定 */
function assignInitSkills(kind,key,tier){
 const pools=kind==="pet"?PET_SKILLS:PARTNER_SKILLS;
 const maxT=Math.min(tier||0,4),ids=[];
 for(let s=0;s<3;s++){
  const t=Math.max(0,Math.min(maxT,maxT-1+s));
  const pool=pools[t]||[];
  if(!pool.length)continue;
  const k=hashStr(key+"#"+s);let id=null;
  for(let j=0;j<pool.length;j++){const c=pool[(k+j)%pool.length].id;if(!ids.includes(c)){id=c;break;}}
  if(id)ids.push(id);
 }
 return ids;
}
function skillIdsOf(o){return Array.isArray(o&&o.skills)?o.skills.filter(id=>SKILL_DEF[id]):[];}
function skillAtkMult(o){let m=0;for(const id of skillIdsOf(o))m+=SKILL_ATK_PCT[SKILL_DEF[id].tier]||0;return 1+m/100;}
function mkPet(pid,level){const b=PETS[pid];return {pid,name:b.name,level:level,exp:0,skills:assignInitSkills("pet",pid,b.tier)};}
function mkPartnerObj(e,level){return {pid:e.pid,name:e.name,tier:e.tier,sub:e.sub,level:level,exp:0,equip:{weapon:null,armor:null},skills:assignInitSkills("partner",e.pid||e.name,e.tier)};}
function ensurePetSkills(pet){if(!pet)return;if(!Array.isArray(pet.skills)||!pet.skills.length)pet.skills=assignInitSkills("pet",pet.pid,((PETS[pet.pid]||{}).tier||0));}
function ensurePartnerSkills(pt){if(!pt)return;if(!Array.isArray(pt.skills)||!pt.skills.length)pt.skills=assignInitSkills("partner",pt.pid||pt.name,pt.tier||0);}
function skillListHTML(o){
 const ids=skillIdsOf(o);
 return ids.length?ids.map(id=>{const sd=SKILL_DEF[id];return tieredName(sd.name,sd.tier);}).join("<span class=\"dim\"> · </span>"):"<span class=\"dim\">无</span>";
}
function openSkillModal(kind,idx){
 const o=kind==="pet"?S.pets[idx]:S.partners[idx];if(!o)return;
 ensurePetSkills(kind==="pet"?o:null);ensurePartnerSkills(kind==="partner"?o:null);
 const tier=kind==="pet"?((PETS[o.pid]||{}).tier||0):(o.tier||0);
 const cost=RELEARN_COST[tier]||20000;
 let h=`<div class="card"><h3>${o.name}的技能</h3><p class="dim">每只宠物/每位伙伴可拥有3个技能，技能按品级提升攻击（黄+3%/玄+5%/地+8%/天+12%/神+18%，可叠加）；战斗中出战宠物/伙伴有概率施展技能造成额外伤害。初始技能最高为神级，圣级/至尊技能后续通过限时活动获取。点「更换」可领悟新技能（随机同品级及以下，最高神级），费用${cost}铜币。</p>`;
 skillIdsOf(o).forEach((id,s)=>{
  const sd=SKILL_DEF[id];
  h+=`<div class="tier"><div><div>${tieredName(sd.name,sd.tier)} <span class="dim">${PTIERS[sd.tier]}级 · 攻击+${SKILL_ATK_PCT[sd.tier]}%</span></div><div class="m">${sd.desc}</div></div><button class="btn small autow" data-relearn="${s}">更换</button></div>`;
 });
 h+=`<button class="btn small" onclick="closeModal()">关闭</button></div>`;
 modal(h);
 document.querySelectorAll("[data-relearn]").forEach(b=>b.onclick=()=>relearnSkill(kind,idx,+b.dataset.relearn,cost,tier));
}
function relearnSkill(kind,idx,slot,cost,ownTier){
 const o=kind==="pet"?S.pets[idx]:S.partners[idx];if(!o)return;
 if(S.player.coins<cost){toast("铜币不足");return;}
 const pools=kind==="pet"?PET_SKILLS:PARTNER_SKILLS;
 const maxT=Math.min(ownTier||0,4);
 const cur=skillIdsOf(o),cand=[];
 for(let t=0;t<=maxT;t++)for(const sk of(pools[t]||[]))if(!cur.includes(sk.id))cand.push(sk);
 if(!cand.length){toast("已学全当前可领悟的技能");return;}
 S.player.coins-=cost;
 const nk=pick(cand);
 if(!Array.isArray(o.skills))o.skills=[];
 o.skills[slot]=nk.id;
 save();openSkillModal(kind,idx);toast(`领悟了「${nk.name}」！`);
}

function marketRefPrice(L){ // 参考价（铜币）

function marketVisit(){ // 每次进入交易行：土豪NPC前来购买寄售
 const sold=[];let _sellCoins=0,_sellGold=0;const _sellTxt=[];
 for(const L of [...S.marketMine]){
  const ref=marketRefPrice(L);
  const pc=L.cur==="gold"?L.price*12000:L.price;
  const ratio=pc/Math.max(1,ref);
  let p;
  if(ratio>5)p=0;else if(ratio>2)p=0.08;else if(ratio>1.2)p=0.25;else if(ratio>0.8)p=0.45;else p=0.7;
  if(tierOfListing(L)>=4)p=Math.min(0.93,p+0.15);
  if(Math.random()<p){
   const tax=Math.max(1,Math.floor(L.price*0.05)),gain=L.price-tax;
   _sellCoins+=L.cur==="gold"?0:gain;_sellGold+=L.cur==="gold"?gain:0;
   S.marketMine=S.marketMine.filter(x=>x.id!==L.id);
   const buyer=pick(WHALES),nm=stripHtml(listingName(L));
   _sellTxt.push(`${buyer}买走${nm}（实得${fmtPrice(gain,L.cur)}）`);
   S.marketLog.unshift({txt:`${buyer}买走了你的${nm}，${fmtPrice(L.price,L.cur)}（税${fmtPrice(tax,L.cur)}，实得${fmtPrice(gain,L.cur)}，已发至邮箱）`,t:Date.now()});
   if(S.marketLog.length>20)S.marketLog.length=20;
   pushChat("world",{n:buyer,vip:10,t:Date.now(),txt:`在交易行拿下了${nm}，爽！`});
   sold.push({buyer,nm,gain,cur:L.cur});
  }
 }
  if(sold.length){
  sendMail("交易行寄售成交",_sellTxt.join("；")+"。成交款已发放至邮箱，请手动领取。",{coins:_sellCoins,gold:_sellGold});
  calcStats();save();}
 return sold;}

function tradeHash(s){let h1=0xdeadbeef^s.length,h2=0x41c6ce57^s.length;const S2="jh-trade-2026";s=S2+s;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return((h2>>>0).toString(36)+(h1>>>0).toString(36));}
function genTradeCode(kind,ref){

 return "JY"+b64+tradeHash(b64).slice(0,6).toUpperCase();
}

if(S.clearLog){const dm={0:0,1:1,2:2,3:3,4:3,5:3},nl={};for(const k of Object.keys(S.clearLog)){const m=/^(\d+):(\d+):(\d+)$/.exec(k);if(!m)continue;const ndi=dm[+m[2]];if(ndi===undefined)continue;const si=+m[3];if(si>=(ndi===0?10:15))continue;nl[m[1]+":"+ndi+":"+si]=1;}S.clearLog=nl;} // 难度重构迁移：6难度→4难度（圣级/神级并入终极，普通只保留前10关），可重复执行无副作用
wbSettle();calcStats();TAB="home";render();
const offR=offlineSettle();
if(offR)setTimeout(()=>{try{modal(`<div class="card"><h3>离线挂机结算</h3><p class="dim">${offR.txt}${offR.capped?"（最多累计8小时）":""}</p><p>修为 <b class="gold">+${offR.exp}</b> · 铜币 <b class="gold">+${offR.coins}</b>${offR.stam>0?` · 体力 <b class="gold">+${offR.stam}</b>`:""}</p><p class="dim">出战宠物与伙伴也获得了挂机修为。</p><div class="rowbtns"><button class="btn small primary" onclick="closeModal()">领取</button></div></div>`);}catch(e){}},300);}
 else{rCreate();}
 setInterval(()=>{ // 每45秒回1点体力
 if(S&&S.player&&S.player.stamina<S.player.maxStamina){S.player.stamina++;save();if(TAB==="home"&&!B)renderTop();}
 },45000);
})();
