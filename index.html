const $=id=>document.getElementById(id);

const pick=a=>a[Math.floor(Math.random()*a.length)];
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800);}
function modal(html){$("modalbox").innerHTML=html;$("modal").classList.add("show");}
function closeModal(){$("modal").classList.remove("show");}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
function nowStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");}

 S.bag.forEach(x=>{if(x.iid)owned.add(x.iid);});
 Object.values(S.equip).forEach(x=>{if(x&&x.iid)owned.add(x.iid);});

function rollWeaponBonus(tier){ // 武器随机属性（按阶缩放）
 const b={};
 b.atk=Math.floor(tier*(2+Math.random()*4));
 if(Math.random()<0.6)b.def=Math.floor(tier*(1+Math.random()*2));
 if(Math.random()<0.5)b.hp=tier*(10+Math.floor(Math.random()*20));
 if(Math.random()<0.4)b.spd=Math.floor(tier*(0.5+Math.random()*1.5));
 if(Math.random()<0.25)b.luck=1+Math.floor(Math.random()*Math.min(3,tier));
 for(const k of Object.keys(b))if(!b[k])delete b[k];
 return b;
}

/* ============ 充值兑换码（后台管控） ============
规则：游戏内不提供直接充值，玩家凭后台生成的兑换码兑换元宝。
兑换码格式 XXXX-XXXX-XXXX：首字符为档位(A~F对应TIERS 0~5)+5位随机码+6位签名。
签名密钥写在前端代码中，可防普通玩家伪造；如需银行级安全需后端服务。 */
const CD_A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const CD_SECRET="jhMcc2026#X7q2";
function cyrb53(str,seed){seed=seed||0;var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function cdSig(payload,account){var L=CD_A.length,h=cyrb53(CD_SECRET+"|"+payload+"|"+String(account||"").toUpperCase()),s="";for(var i=0;i<6;i++){s+=CD_A[h%L];h=Math.floor(h/L);}return s;}
function cdVerify(code,account){var raw=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(raw.length!==12)return -1;var p=raw.slice(0,6);if(cdSig(p,account)!==raw.slice(6))return -1;var tier=CD_A.indexOf(p[0]);return(tier>=0&&tier<TIERS.length)?tier:-1;}
function newAccount(){return "JH"+String(Math.floor(100000+Math.random()*900000));}
function cdNorm(code){return String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");}

function rSkill(){

const pf=p.prof||"warrior";
let h=`<div class="card"><h3>江湖技能 · ${PROFS[pf].name}专属</h3><p>已学技能：${p.skills.filter(s=>SKILLS[s]).map(s=>`${SKILLS[s].name}<span class="dim">(耗内${SKILLS[s].mp}·${SKILLS[s].mult}倍)</span>`).join("、")||"无"}</p><p class="dim">战斗中点「攻击」会自动施展已学的最强技能（内力不足时用普通攻击）。各职业只能学习本职业技能。</p></div><div class="card"><h3>可学技能</h3>`;
let any=false;
Object.entries(SKILLS).forEach(([id,sk])=>{
 if(sk.prof!==pf||p.skills.includes(id))return; any=true;
 const lv=sk.lv||1,cost=sk.cost||0,can=p.level>=lv&&p.coins>=cost;
 h+=`<div class="tier"><div><div class="gold">${sk.name} <span class="ptier ${djc[sk.dj[0]]||"神"}">${sk.dj}</span></div><div class="m">${sk.desc} · 耗内${sk.mp} · 威力${sk.mult}倍 · 需${lv}级 ${cost}铜币</div></div><button class="btn small" style="width:auto;margin:0" ${can?"":"disabled"} data-learn="${id}">${can?"学习":"未达标"}</button></div>`;
});
if(!any)h+=`<p class="dim">本职业技能已全部学会，勤加修炼吧！</p>`;
h+=`</div>`;m.innerHTML=h;
m.querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>{
 const sk=SKILLS[b.dataset.learn],lv=sk.lv||1,cost=sk.cost||0;
 if(p.level<lv||p.coins<cost){toast("未达学习条件");return;}
 p.coins-=cost;p.skills.push(b.dataset.learn);save();render();toast(`学会了「${sk.name}」！`);
});
}

function dmgCalc(atk,def,mult,luck){
let d=Math.max(1,(atk*(mult||1.6)-def*0.8))* (0.9+Math.random()*0.2);
const crit=Math.random()<Math.min(0.5,0.15+(luck||0)*0.01); if(crit)d*=1.6;
return{h:Math.floor(d),crit};
}
function foeTurn(){
const f=B.foe,p=S.player;

p.hp=Math.max(0,p.hp-d.h);
log(`<span class="foe">${f.name}攻来，造成 ${d.h} 点伤害${d.crit?"（暴击！）":""}</span>`);

function petTurn(){
const pet=S.player.level>=10?S.pets[S.activePet]:undefined;
if(!pet||B.over)return;
const b=PETS[pet.pid],f=B.foe;
const pa=Math.floor(b.atk*(1+0.15*(pet.level-1))*petTierMult(b));

}
const EXPDAN={exp2:{name:"双倍经验丹",mult:2,price:25},exp3:{name:"三倍经验丹",mult:3,price:45},exp5:{name:"五倍经验丹",mult:5,price:80}};

function expBuffLeft(){const b=S.expBuff;if(b&&Date.now()<b.until)return Math.ceil((b.until-Date.now())/60000);return 0;}
function gainExp(n){
const p=S.player;p.exp+=n;
let ups=0;
while(p.exp>=expNeed(p.level)){p.exp-=expNeed(p.level);p.level++;ups++;}
if(ups>0){calcStats();p.hp=p.maxhp;p.mp=p.maxmp;log(`<span class="sys">升级了！当前 ${p.level} 级，气血内力回满！</span>`);}

function gainPetExp(n){

pet.exp+=n;
while(pet.exp>=petExpNeed(pet.level)){pet.exp-=petExpNeed(pet.level);pet.level++;}

/* 世界BOSS：按玩家造成伤害比例结算奖励（胜负都有，击杀奖励最丰厚） */
function wbSettle(win){
const p=S.player,f=B.foe,em=expMult();
const ratio=(B.wbdmg||0)/Math.max(1,f.maxhp);
const pct=Math.min(100,Math.floor(ratio*100));
let mult,fn,evoP,label;
if(win){mult=1;fn=4+Math.floor(Math.random()*3);evoP=0.5;label="击杀";}
else if(ratio>=0.6){mult=0.7;fn=3+Math.floor(Math.random()*2);evoP=0.3;label="重创";}
else if(ratio>=0.3){mult=0.4;fn=2+Math.floor(Math.random()*2);evoP=0.15;label="激战";}
else if(ratio>0){mult=0.2;fn=1+Math.floor(Math.random()*2);evoP=0.05;label="参与";}
else{mult=0;fn=1;evoP=0;label="观战";}
const ge=Math.floor(f.exp*em*mult),gc=Math.floor(f.coins*mult);
log(`<span class="sys">世界BOSS结算【${label}】：累计造成 ${B.wbdmg||0} 点伤害（${pct}%）</span>`);
if(ge>0){gainExp(ge);p.coins+=gc;gainPetExp(Math.floor(ge/2));gainPartnerExp(Math.floor(ge/2));
log(`<span class="sys">获得修为 ${ge}${em>1?`（${em}倍经验）`:""}、铜币 ${gc}</span>`);}
p.feather=(p.feather||0)+fn;
log(`<span class="sys">世界BOSS掉落灵羽×${fn}！可在「翅膀」页升级翅膀</span>`);
if(evoP>0&&Math.random()<evoP){addConsumable("神级进化石","evostone");log(`<span class="sys">世界BOSS掉落${tieredName("神级进化石",4)}×1！天级宠物合成神级必需材料</span>`);}
let saintP=0,zunP=0;
if(win){saintP=0.08;zunP=0.02;}
else if(ratio>=0.6){saintP=0.03;zunP=0.008;}
else if(ratio>=0.3){saintP=0.01;zunP=0.003;}
if(saintP>0&&Math.random()<saintP){addConsumable("圣级进化石","evo_saint");log(`<span class="sys">鸿运当头！世界BOSS掉落${tieredName("圣级进化石",5)}×1！神级宠物合成圣级必需材料</span>`);}
if(zunP>0&&Math.random()<zunP){addConsumable("至尊进化石","evo_zun");log(`<span class="sys">天选之子！世界BOSS掉落${tieredName("至尊进化石",6)}×1！圣级宠物合成至尊级必需材料</span>`);}
if(win){
pushChat("world",{sys:1,txt:`恭喜「${p.name}」击败了${f.name}，威震江湖！`,t:Date.now()});
const cand=Object.keys(GONGFA).filter(g=>GONGFA[g].tier<4&&!gfLearned(g));
if(cand.length){
const w={0:40,1:30,2:20,3:10};let tot=0;
const bag=cand.map(g=>{const ww=w[GONGFA[g].tier]||10;tot+=ww;return[g,ww];});
let r=Math.random()*tot,pg=bag[0][0];
for(const[g,ww]of bag){r-=ww;if(r<=0){pg=g;break;}}
S.gongfaLearned=S.gongfaLearned||{};S.gongfaLearned[pg]=1;
log(`<span class="sys">世界BOSS掉落：功法《${GONGFA[pg].name}》！去功法页修炼吧</span>`);
}else{p.gold+=88;log(`<span class="sys">功法已集齐，获得88元宝！</span>`);}
const unownedYH=YIHUO.filter(f=>!(S.yihuo||[]).includes(f.name));
if(unownedYH.length&&Math.random()<0.03*(1+vipDrop()/100)){
const yf=pick(unownedYH);S.yihuo=S.yihuo||[];S.yihuo.push(yf.name);
log(`<span class="sys">天降机缘！世界BOSS掉落${yf.name}，已自动炼化！</span>`);
}
}
}
function endBattle(win){

if(win&&!B.wb){
const em=expMult(),ge=Math.floor(f.exp*em);

}else{

else{const iid=pick(pool);S.bag.push(mkWeapon(iid));log(`<span class="sys">获得了！</span>`);}
if(Math.random()<0.2){addConsumable("洗炼石","xilian");log(`<span class="sys">BOSS掉落：洗炼石×1！可在背包洗炼武器属性</span>`);}
if(Math.random()<0.3*(1+vipDrop()/100)){
 const asl=pick(ARMOR_SLOTS),ai=topItemOfSlot(tier,asl);
 if(ai){S.bag.push({iid:ai,enh:0});log(`<span class="sys">BOSS掉落：${ITEMS[ai].name}！集齐同部位四件BOSS防具可合成轩辕防具</span>`);}
}
}else if(Math.random()<0.3*(1+vipDrop()/100)){
const iid=pick(pool);
S.bag.push(mkWeapon(iid));
log(`<span class="sys">获得了！</span>`);
}
}
// 充值红包掉落：散人打怪也能攒累计充值奖励进度，每日最多100个
const rpToday=nowStr().slice(0,10);
if(S.rpDay!==rpToday){S.rpDay=rpToday;S.rpDayCount=0;}
const rpRate=B.wb?0.5:(B.arena?0.2:0.06);
if((S.rpDayCount||0)<100&&Math.random()<rpRate){
 const rr=Math.random(),amt=rr<0.02?10:(rr<0.08?5:(rr<0.20?3:(rr<0.50?1:0.5)));
 rpList().push(amt);S.rpDayCount=(S.rpDayCount||0)+1;
 log(`<span class="sys">获得${amt}元充值红包×1！去充值页开启，可计入累计充值奖励</span>`);
}
if(p.task&&!p.taskDone){p.task.done++;if(p.task.done>=p.task.need){p.taskDone=true;log(`<span class="sys">江湖任务完成，可回任务页领奖！</span>`);}}
}else{
log(`<span class="sys">你败下阵来，被好心人救回，气血恢复…</span>`);
p.hp=1;
}
calcStats();save();
}
function rBattle(){
const m=$("main"),p=S.player,f=B.foe;
let h=`<div class="card"><h3>${f.name} ${f.boss?"":""} <span class="dim">Lv.${f.lv}</span></h3>
<div class="bar hp"><i style="width:${f.hp/f.maxhp*100}%"></i><span>${f.hp}/${f.maxhp}</span></div>
<div id="battlelog">${B.log.map(t=>`<p>${t}</p>`).join("")}</div>`;

h+=`<button class="btn primary" id="bback">继续闯荡</button></div>`;
}else{

<div class="rowbtns">${f.catchPet?`<button class="btn small" id="a_cap">捕捉</button>`:""}<button class="btn small danger" id="a_flee">逃跑</button></div></div>`;
}
m.innerHTML=h;
const bl=$("battlelog");bl.scrollTop=bl.scrollHeight;
if(B.over){$("bback").onclick=()=>{B=null;TAB="home";render();};return;}
$("a_atk").onclick=()=>doAutoAtk();
$("a_med").onclick=()=>{
const med=S.bag.find(x=>x.use);
if(!med){toast("背包里没有药品，去商店买");return;}
if(med.use==="hp150")p.hp=Math.min(p.maxhp,p.hp+150);
if(med.use==="hp450")p.hp=Math.min(p.maxhp,p.hp+450);
if(med.use==="mpfull")p.mp=p.maxmp;
S.bag.splice(S.bag.indexOf(med),1);
log(`<span class="me">你服下了</span>`);
afterPlayer();};
const cap=$("a_cap");if(cap)cap.onclick=doCapture;
$("a_flee").onclick=()=>{
if(Math.random()<0.7){log(`<span class="sys">你成功逃脱了。</span>`);B.over=true;p.hp=Math.max(1,p.hp);save();rBattle();}
else{log(`<span class="foe">逃跑失败！</span>`);foeTurn();save();rBattle();}
};
}
function bestSkill(){
 const p=S.player;let best=null,bm=0;
 for(const id of(p.skills||[])){const sk=SKILLS[id];if(!sk)continue;
  if(p.mp>=sk.mp&&sk.mult>bm){best=id;bm=sk.mult;}}
 return best;
}
function doAutoAtk(){
 const sk=bestSkill();
 doAtk(sk);
 if(sk)toast("施展「"+SKILLS[sk].name+"」！");
}
function doAtk(skId){
const p=S.player,f=B.foe;
if(skId){
const sk=SKILLS[skId];
if(p.mp<sk.mp){toast("内力不足");return;}
p.mp-=sk.mp;
const d=dmgCalc(p.atk,f.def,sk.mult,p.luck);
f.hp=Math.max(0,f.hp-d.h);if(B.wb)B.wbdmg=(B.wbdmg||0)+d.h;
log(`<span class="me">你使出「${sk.name}」，造成 ${d.h} 点伤害${d.crit?"（暴击！）":""}</span>`);
}else{
const d=dmgCalc(p.atk,f.def,1.6,p.luck);
f.hp=Math.max(0,f.hp-d.h);if(B.wb)B.wbdmg=(B.wbdmg||0)+d.h;
log(`<span class="me">你挥剑斩去，造成 ${d.h} 点伤害${d.crit?"（暴击！）":""}</span>`);
}
if(f.hp<=0){endBattle(true);}else{foeTurn();}
save();rBattle();
}
function afterPlayer(){const f=B.foe;if(f.hp<=0){endBattle(true);}else{foeTurn();}save();rBattle();}
function doCapture(){

}

function addConsumable(name,use,n){ // 丹药/材料叠加，每组上限99
 n=n||1;
 while(n>0){
  let st=S.bag.find(x=>x.use===use&&!x.iid&&(x.n||0)<99);
  if(!st){st={name,use,n:0};S.bag.push(st);}
  const add=Math.min(99-(st.n||0),n);
  st.n=(st.n||0)+add;n-=add;
 }
}
function takeConsumable(use){ // 消耗1个，返回是否成功
 const ix=S.bag.findIndex(x=>x.use===use&&!x.iid);
 if(ix<0)return false;
 const it=S.bag[ix],n=(it.n||1)-1;
 if(n<=0)S.bag.splice(ix,1);else it.n=n;
 return true;
}

const SYNTH_RATE=[0.8,0.7,0.6,0.5,0.4,0.3]; // 黄->玄 ... 圣->至尊 成功率
const SYNTH_STONE={3:["evostone","神级进化石"],4:["evo_saint","圣级进化石"],5:["evo_zun","至尊进化石"]}; // 高阶合成所需进化石：商城有售（神1999/圣19999/至尊29999元宝），世界BOSS也掉落（至尊石概率极低）
function countItem(use){return S.bag.filter(x=>x.use===use&&!x.iid).reduce((a,x)=>a+(x.n||1),0);}
function synthCount(t){return S.pets.filter((pet,i)=>PETS[pet.pid].tier===t&&i!==S.activePet).length;}
function sortIdxByTier(arr,infoOf){ // 显示用排序：品级降序（至尊第一），同品级按档降序，再按等级降序；只返回下标，原数组不动
 return arr.map((_,i)=>i).sort((a,b)=>{
  const A=infoOf(arr[a]),B=infoOf(arr[b]);
  if(B.tier!==A.tier)return B.tier-A.tier;
  if((B.sub||0)!==(A.sub||0))return (B.sub||0)-(A.sub||0);
  return (arr[b].level||0)-(arr[a].level||0);
 });
}

function grantRecharge(tier,oid){ // 兑换码到账（后台管控，游戏内无直接充值）
 const t=TIERS[tier],oldV=vipLevel(),isFirst=!S.orders.length;
 S.player.gold+=t.gold;
 S.orders.push({id:oid,money:t.money,gold:t.gold,time:nowStr(),status:"兑换码到账"});
 const newV=vipLevel();
 let msg=`兑换成功！元宝+${t.gold}`;
 if(newV>oldV){msg=`兑换成功！晋升 VIP${newV}！`;S.wornTitle={k:"vip",id:newV};}
 if(newV>=6&&!((S.gongfaLearned||{}).darin)){S.gongfaLearned=S.gongfaLearned||{};S.gongfaLearned.darin=1;msg+=` 获赠神级功法《大日焚天诀》！`;}
 if(isFirst){
  const sword={iid:"w0",enh:0},cur=S.equip.weapon?ITEMS[S.equip.weapon.iid]:null;
  if(!cur||(cur.atk||0)<26){if(S.equip.weapon)S.bag.push(S.equip.weapon);S.equip.weapon=sword;msg+=` 小红剑已穿戴！（永久）`;}
  else{S.bag.push(sword);msg+=` 获赠小红剑！（永久）`;}
 }
 calcStats();save();render();toast(msg);
}
function redeemCode(){
 const p=S.player;
 const inp=$("cdinput"),code=inp?inp.value:"";
 const tier=cdVerify(code,p.account);
 if(tier<0){toast("兑换码无效，或与当前账号不匹配");return;}
 const raw=cdNorm(code);
 S.usedCodes=S.usedCodes||[];
 if(S.usedCodes.includes(raw)){toast("该兑换码已使用过");return;}
 S.usedCodes.push(raw);
 grantRecharge(tier,"CD"+raw.slice(0,8));
}
/* ============ 排行 ============ */
function startArenaBattle(rank){
 const p=S.player;
 if(arenaLeft()<=0){toast("今日挑战次数已用完，明日再战");return;}
 if(p.stamina<5){toast("体力不足（需5点），去打坐或商城买体力丹");return;}
 p.stamina-=5;S.arena.left--;
 const f=ARENA_OPPS[rank]||arenaOpp(rank);
 B={arena:true,oppRank:rank,foe:{...f,maxhp:f.hp},log:[],over:false};
 log(`<span class="sys">竞技场挑战！${f.name}（第${rank}名）出现了！</span>`);
 save();rBattle();
}
function rArena(){
 const m=$("main"),p=S.player;
 arenaInit();const A=S.arena,left=arenaLeft(),today=nowStr().slice(0,10);
 const claimed=A.reward===today;
 let h=`<div class="card"><h3>竞技场</h3>
 <p>我的排名：<b class="gold">第 ${A.rank} 名</b>· 今日剩余挑战 <b class="gold">${left}</b>/5 次（每次5体力）</p>
 <p class="dim">挑战排名高于自己的对手，获胜则排名上升。排名越高对手越强，前三名每日可领丰厚奖励！</p></div>`;
 if(A.rank<=3){
 const rw=[null,{gold:200,coins:20000,feather:20},{gold:120,coins:12000,feather:12},{gold:80,coins:8000,feather:8}][A.rank];
 h+=`<div class="card"><h3>前三每日奖励</h3><div class="tier"><div><div class="gold">第${A.rank}名 · 每日可领</div><div class="m">元宝${rw.gold} · 铜币${rw.coins} · 灵羽${rw.feather}</div></div>
 <button class="btn small primary" style="width:auto;margin:0" id="arenaReward"${claimed?" disabled":""}>${claimed?"已领取":"领取"}</button></div></div>`;
 }
 h+=`<div class="card"><h3>可挑战的对手</h3>`;
 const rs=[];for(const d of[1,2,4,7,10]){const r=A.rank-d;if(r>=1)rs.push(r);}
 if(!rs.length)h+=`<p class="dim">已是竞技场第一，独孤求败！</p>`;
 ARENA_OPPS={};
 for(const r of rs){const f=arenaOpp(r);ARENA_OPPS[r]=f;
 const pw=Math.floor(f.atk*3+f.def*2+f.hp*0.5+f.spd*2);
 h+=`<div class="tier"><div><div class="gold"><span class="vplink" data-opp="${r}">${f.name}</span> <span class="dim">第${r}名</span></div><div class="m">Lv.${f.lv} · 战力约${pw}</div></div>
 <button class="btn small" style="width:auto;margin:0" data-ch="${r}"${left<=0?" disabled":""}>挑战</button></div>`;}
 h+=`</div>`;
 const bl=[...A.top.map(n=>({...n})),{name:p.name+"（我）",rank:A.rank,me:true}].sort((a,b)=>a.rank-b.rank).slice(0,10);
 h+=`<div class="card"><h3>竞技场排行榜</h3>`;
 h+=bl.map((r,i)=>`<div class="rankrow${r.me?" me":""}"><span>第${r.rank}名 · <span class="vplink" data-top="${i}">${vipName(r.name,r.me?vipLevel():(hashStr(r.name)%9))}</span></span></div>`).join("")+`</div>`;
 window._atop=bl;
 m.innerHTML=h;
 m.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>startArenaBattle(+b.dataset.ch));
 m.querySelectorAll("[data-opp]").forEach(el=>el.onclick=()=>{
  const f=ARENA_OPPS[+el.dataset.opp];
  viewProfile({_prof:{name:f.name,vip:Math.min(12,Math.floor(f.lv/8)),lv:f.lv,zl:Math.floor(f.atk*3+f.def*2+f.hp*0.5+f.spd*2),atk:f.atk,def:f.def,maxhp:f.hp,spd:f.spd,pet:"?",wingT:1,title:"竞技高手"}});
 });
 m.querySelectorAll("[data-top]").forEach(el=>el.onclick=()=>{const r=window._atop[+el.dataset.top];viewProfile(r.me?{me:1}:{name:r.name.replace(/（我）$/,""),vip:0,lv:Math.max(1,105-r.rank)});});
 const ar=$("arenaReward");
 if(ar)ar.onclick=()=>{
 if(A.rank>3||A.reward===nowStr().slice(0,10))return;
 const rw=[null,{gold:200,coins:20000,feather:20},{gold:120,coins:12000,feather:12},{gold:80,coins:8000,feather:8}][A.rank];
 A.reward=nowStr().slice(0,10);
 p.gold+=rw.gold;p.coins+=rw.coins;p.feather=(p.feather||0)+rw.feather;

 };

/* ============ 玩家档案查看 ============ */
function hashStr(s){let h=0;s=String(s);for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
const NPC_PETS=["啸天虎","碧鳞蛇","金翅雕","金蚕蛊","苍原狼","月影兔","灵羽鸡","泰坦巨猿","天青牛蟒","九幽冥雀"];
const NPC_TITLES=["武林新秀","一方豪杰","江湖名宿","绝世高手","武林神话","独步天下","剑啸江湖","笑傲群雄"];
const NPC_EQPRE=["铁","精钢","银","金","龙纹","轩辕"];
const NPC_EQN={weapon:"剑",hat:"盔",armor:"甲",pants:"裤",bracer:"护腕",ring:"戒",necklace:"项链",medal:"勋章",boots:"靴",charm:"佩"};
function npcProfile(name,ref){
 ref=ref||{};const h=hashStr(name);
 const power=ref.zl||(ref.pay||0)*1.2||(ref.score||0)*10||((ref.tier||1)*9000)||(ref.lv||20)*900||8000;
 const f=0.9+(h%20)/100,profs=Object.keys(PROFS);
 return {name,vip:ref.vip||(h%6),lv:ref.lv||(20+h%70),prof:profs[h%3],
  zl:Math.round(ref.zl||power),
  atk:Math.round(power*0.016*f),def:Math.round(power*0.011*f),
  maxhp:Math.round(power*0.85*f),spd:Math.round(power*0.007*f),
  pet:NPC_PETS[h%NPC_PETS.length],wingT:1+h%12,title:NPC_TITLES[h%NPC_TITLES.length],
  eqTier:1+Math.min(5,Math.floor(power/25000)),gfPick:h%(Object.keys(GONGFA).length)};
}
function npcEquip(np){
 const pre=NPC_EQPRE[np.eqTier-1]||"铁",o={};
 for(const s of["weapon","hat","armor","pants","bracer1","bracer2","ring1","ring2","necklace","medal","boots","charm"]){
  const base=s.replace(/[12]$/,"");o[s]=pre+NPC_EQN[base];}
 return o;
}
function npcGongfa(np){
 const ks=Object.keys(GONGFA),n=1+(hashStr(np.name)%3),o=[];
 for(let i=0;i<n;i++)o.push(GONGFA[ks[(np.gfPick+i*7)%ks.length]].name);
 return [...new Set(o)];
}
function myBestPetName(){let s=0,n="暂无宠物";for(const pet of(S.pets||[])){const sc=petScore(pet);if(sc>s){s=sc;n=pet.name;}}return n;}
function myEquipStr(){
 const o=[];
 for(const s of SLOTS){const it=S.equip[s];if(it&&ITEMS[it.iid])o.push(SLOTNAME[s]+"："+itemNameHTML(it));}
 return o.length?o.join(" · "):"暂无装备";
}
function myGongfaStr(){
 const ks=Object.keys(S.gongfaLearned||{}).filter(g=>GONGFA[g]);
 return ks.length?ks.map(g=>GONGFA[g].name).join(" · "):"暂无功法";
}
function eqGfRows(eqObj,gfArr){
 let eqs=[];
 for(const s of SLOTS){if(eqObj[s])eqs.push(SLOTNAME[s]+"："+escHtml(eqObj[s]));}
 return `<div class="tier"><div><div class="m">装备</div><div class="gold" style="font-size:13px;line-height:1.7">${eqs.length?eqs.join(" · "):"暂无装备"}</div></div></div>`
  +`<div class="tier"><div><div class="m">功法</div><div class="gold" style="font-size:13px;line-height:1.7">${gfArr.length?gfArr.map(escHtml).join(" · "):"暂无功法"}</div></div></div>`;
}
function cmpRow(label,nv,pv){
 const hc=nv>pv?"good":nv<pv?"bad":"",pc=pv>nv?"good":pv<nv?"bad":"",d=nv-pv;
 return `<div class="tier"><div><div class="m">${label}</div><div class="gold"><span class="${hc}">${nv}</span> <span class="dim">vs</span> <span class="${pc}">${pv}</span></div><div class="m dim">${d===0?"双方持平":d>0?"对方高 "+d:"你高 "+(-d)}</div></div></div>`;
}
function viewProfile(r){
 const p=S.player,me=!!r.me;
 const np=r._prof||(me?null:npcProfile(r.name,r));
 const myVip=vipLevel(),myZl=zhanli();
 let h=`<div class="card"><h3>${me?"我的档案":"玩家档案"}</h3>`;
 if(me){
  h+=`<p>名字：${vipName(p.name,myVip)} <span class="dim">VIP${myVip}</span></p><p class="dim">${PROFS[p.prof||"warrior"].name} · Lv.${p.level}</p>`;
  h+=cmpRow("战力",myZl,myZl)+cmpRow("攻击",p.atk,p.atk)+cmpRow("防御",p.def,p.def)+cmpRow("气血",p.maxhp,p.maxhp)+cmpRow("速度",p.spd,p.spd);
  h+=`<div class="tier"><div><div class="m">装备</div><div class="gold" style="font-size:13px;line-height:1.7">${myEquipStr()}</div></div></div>`
   +`<div class="tier"><div><div class="m">功法</div><div class="gold" style="font-size:13px;line-height:1.7">${myGongfaStr()}</div></div></div>`;
 }else{
  const ratio=np.zl/Math.max(1,myZl);
  h+=`<p>名字：${vipName(np.name,np.vip)} <span class="dim">VIP${np.vip}</span></p><p class="dim">${PROFS[np.prof].name} · Lv.${np.lv} · 称号${escHtml(np.title)}</p>`;
  h+=`<p>${ratio>=1?`对方战力约为你的 <b class="bad">${ratio.toFixed(1)}</b> 倍，再接再厉！`:`你的战力已是对方的 <b class="good">${(1/ratio).toFixed(1)}</b> 倍！`}</p>`;
  h+=cmpRow("战力",np.zl,myZl)+cmpRow("等级",np.lv,p.level)+cmpRow("攻击",np.atk,p.atk)+cmpRow("防御",np.def,p.def)+cmpRow("气血",np.maxhp,p.maxhp)+cmpRow("速度",np.spd,p.spd);
  h+=`<div class="tier"><div><div class="m">宠物 / 翅膀</div><div class="gold">${escHtml(np.pet)} <span class="dim">vs</span> ${escHtml(myBestPetName())}</div><div class="m dim">${WING_NAMES[np.wingT]} <span class="dim">vs</span> ${(S.wing&&S.wing.tier)?WING_NAMES[S.wing.tier]:"未激活"}</div></div></div>`;
  h+=eqGfRows(npcEquip(np),npcGongfa(np));
 }
 h+=`<button class="btn" id="vpClose" style="margin-top:8px">关闭</button></div>`;
 modal(h);

 const c=S.chat||(S.chat={world:[],sect:[],ch:"world",cd:0});
 (c[ch]=c[ch]||[]).push(msg);
 if(c[ch].length>60)c[ch]=c[ch].slice(-60);

}

function chatLine(m){
 const t=new Date(m.t||Date.now());
 const ts=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
 if(m.sys)return `<p class="chatline"><span class="sys">[系统 ${ts}] ${escHtml(m.txt)}</span></p>`;
 return `<p class="chatline"><span class="dim">[${ts}]</span> <span class="vplink" data-cn="${escHtml(m.n)}" data-cv="${m.vip||0}" data-me="${m.me?1:0}">${vipName(m.n,m.vip)}</span>：${escHtml(m.txt)}</p>`;

function sendChat(){
 const p=S.player,c=S.chat,inp=$("chatIn"),txt=(inp.value||"").trim();
 if(!txt){toast("先写点什么吧");return;}
 const now=Date.now();
 if(c.cd&&now-c.cd<5000){toast("发言太快，"+Math.ceil((5000-(now-c.cd))/1000)+"秒后再试");return;}
 c.cd=now;
 pushChat(c.ch||"world",{n:p.name,vip:vipLevel(),t:now,txt:txt.slice(0,60),me:1});

}
