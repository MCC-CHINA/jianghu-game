<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>江湖行 · 充值后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#14141c;color:#e8e8f0;font-family:-apple-system,"PingFeng SC","Microsoft YaHei",sans-serif;max-width:640px;margin:0 auto;padding:16px;min-height:100vh}
h2{font-size:20px;margin:4px 0 12px}
.card{background:#1e1e28;border:1px solid #33333f;border-radius:12px;padding:14px;margin-bottom:12px}
.dim{color:#9a9aad;font-size:13px;line-height:1.7}
label{display:block;font-size:14px;color:#c9c9d6;margin:10px 0 4px}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#14141c;color:#fff;font-size:15px}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:16px;margin-top:12px;cursor:pointer}
.primary{background:linear-gradient(135deg,#c9a227,#8a6d1c);color:#fff;font-weight:700}
.ghost{background:#2a2a36;color:#e8e8f0}
.danger{background:#5a1f1f;color:#ffb3b3}
.codebox{font-size:26px;letter-spacing:3px;text-align:center;background:#0e0e14;border:1px dashed #c9a227;border-radius:10px;padding:16px;margin:12px 0;color:#ffd75e;font-family:monospace;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:8px 6px;border-bottom:1px solid #2c2c38;text-align:left;vertical-align:top}
th{color:#9a9aad;font-weight:400}
td.code{font-family:monospace;color:#ffd75e;word-break:break-all}
.st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px}
.st0{background:#3a2a12;color:#ffcf6e}.st1{background:#123a1e;color:#7ee2a0}
.rowbtns{display:flex;gap:8px}.rowbtns .btn{margin-top:8px}
.warn{background:#2a1a1a;border:1px solid #5a2a2a;border-radius:10px;padding:10px;font-size:13px;color:#e0a0a0;line-height:1.7;margin-bottom:12px}
</style>
</head>
<body>
<div id="gate" class="card">
 <h2>充值后台登录</h2>
 <p class="dim">此页面仅供管理员使用，请勿公开链接。</p>
 <label>管理密码</label>
 <input id="pw" type="password" placeholder="输入管理密码">
 <button class="btn primary" id="login">进入后台</button>
 <p class="dim" id="gateMsg" style="margin-top:8px"></p>
</div>

<div id="app" style="display:none">
 <h2>江湖行 · 充值后台</h2>
 <div class="warn">后台地址请勿公开。兑换码绑定玩家账号，只有该账号能用；同一设备一码一用。兑换码含签名，普通玩家无法伪造，但密钥在前端代码中，懂技术者理论上可破解，介意请上服务器版后台。</div>
 <div class="card">
  <h2 style="font-size:16px">生成兑换码</h2>
  <label>玩家账号（必填，玩家在游戏充值页可复制）</label>
  <input id="acc" placeholder="如：JH482913" style="letter-spacing:2px;text-transform:uppercase">
  <label>充值档位</label>
  <select id="tier"></select>
  <label>玩家备注（选填，如微信名）</label>
  <input id="note" placeholder="如：张三">
  <button class="btn primary" id="gen">生成兑换码</button>
  <div class="codebox" id="out" style="display:none"></div>
  <div class="rowbtns" id="outBtns" style="display:none">
   <button class="btn ghost" id="copy">复制兑换码</button>
   <button class="btn ghost" id="markSent">标记已发放</button>
  </div>
 </div>
 <div class="card">
  <h2 style="font-size:16px">已生成记录</h2>
  <p class="dim">仅保存在本机浏览器中，换设备看不到。</p>
  <div style="overflow-x:auto"><table>
   <tr><th>兑换码</th><th>账号</th><th>档位</th><th>备注</th><th>时间</th><th>状态</th><th>操作</th></tr>
   <tbody id="hist"></tbody>
  </table></div>
  <div class="rowbtns">
   <button class="btn ghost" id="chpw">修改管理密码</button>
   <button class="btn danger" id="logout">退出登录</button>
  </div>
 </div>
</div>

<script>
/* ===== 与游戏内完全一致的兑换码算法 ===== */
var CD_A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
var CD_SECRET="jhMcc2026#X7q2";
function cyrb53(str,seed){seed=seed||0;var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function cdSig(payload,account){var L=CD_A.length,h=cyrb53(CD_SECRET+"|"+payload+"|"+String(account||"").toUpperCase()),s="";for(var i=0;i<6;i++){s+=CD_A[h%L];h=Math.floor(h/L);}return s;}
function cdMake(tier,account){var n="";for(var i=0;i<5;i++)n+=CD_A[Math.floor(Math.random()*CD_A.length)];var p=CD_A[tier]+n,s=cdSig(p,account),raw=p+s;return raw.slice(0,4)+"-"+raw.slice(4,8)+"-"+raw.slice(8,12);}
function cdVerify(code,account){var raw=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(raw.length!==12)return -1;var p=raw.slice(0,6);if(cdSig(p,account)!==raw.slice(6))return -1;var tier=CD_A.indexOf(p[0]);return(tier>=0&&tier<TIERS.length)?tier:-1;}

var TIERS=[
 {money:6,gold:60},{money:30,gold:330},{money:98,gold:1080},
 {money:198,gold:2280},{money:648,gold:7800},{money:1980,gold:24800}
];
var PW_KEY="jh_admin_pw",HIST_KEY="jh_admin_codes",LOGIN_KEY="jh_admin_login";
function getPw(){return localStorage.getItem(PW_KEY)||"admin888";}
function getHist(){try{return JSON.parse(localStorage.getItem(HIST_KEY)||"[]");}catch(e){return[];}}
function saveHist(h){localStorage.setItem(HIST_KEY,JSON.stringify(h));}
function nowStr(){var d=new Date(),p=function(n){return(n<10?"0":"")+n;};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}

var tierSel=document.getElementById("tier");
TIERS.forEach(function(t,i){var o=document.createElement("option");o.value=i;o.textContent="￥"+t.money+" → "+t.gold+"元宝";tierSel.appendChild(o);});

var lastCode=null;
function renderHist(){
 var h=getHist(),tb=document.getElementById("hist");tb.innerHTML="";
 if(!h.length){tb.innerHTML='<tr><td colspan="7" class="dim">暂无记录</td></tr>';return;}
 h.slice().reverse().forEach(function(r){
  var tr=document.createElement("tr");
  tr.innerHTML='<td class="code">'+r.code+'</td><td>'+(r.acc||"-")+'</td><td>￥'+r.money+'</td><td>'+(r.note||"-").replace(/</g,"&lt;")+'</td><td>'+r.time+'</td>'
   +'<td><span class="st '+(r.sent?"st1":"st0")+'">'+(r.sent?"已发放":"未发放")+'</span></td><td></td>';
  var td=tr.lastChild;
  var b1=document.createElement("button");b1.className="btn ghost";b1.style.cssText="padding:4px 8px;font-size:12px;margin:0";b1.textContent=r.sent?"撤回":"发放";
  b1.onclick=function(){var hh=getHist();var it=hh.find(function(x){return x.code===r.code;});if(it){it.sent=!it.sent;saveHist(hh);renderHist();}};
  var b2=document.createElement("button");b2.className="btn danger";b2.style.cssText="padding:4px 8px;font-size:12px;margin:4px 0 0";b2.textContent="删除";
  b2.onclick=function(){if(confirm("删除这条记录？")){saveHist(getHist().filter(function(x){return x.code!==r.code;}));renderHist();}};
  td.appendChild(b1);td.appendChild(b2);tb.appendChild(tr);
 });
}

document.getElementById("login").onclick=function(){
 var v=document.getElementById("pw").value;
 if(v===getPw()){sessionStorage.setItem(LOGIN_KEY,"1");showApp();}
 else{document.getElementById("gateMsg").textContent="密码错误";}
};
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("login").click();});
function showApp(){document.getElementById("gate").style.display="none";document.getElementById("app").style.display="block";renderHist();}
if(sessionStorage.getItem(LOGIN_KEY)==="1")showApp();

document.getElementById("gen").onclick=function(){
 var acc=document.getElementById("acc").value.trim().toUpperCase();
 if(!acc){alert("请先输入玩家账号");return;}
 var code=cdMake(+tierSel.value,acc),t=TIERS[+tierSel.value];
 if(cdVerify(code,acc)!==+tierSel.value){alert("生成校验失败，请重试");return;}
 lastCode=code;
 var h=getHist();h.push({code:code,acc:acc,money:t.money,gold:t.gold,note:document.getElementById("note").value.trim(),time:nowStr(),sent:false});saveHist(h);
 var out=document.getElementById("out");out.style.display="block";out.textContent=code;
 document.getElementById("outBtns").style.display="flex";
 renderHist();
};
document.getElementById("copy").onclick=function(){
 if(!lastCode)return;
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lastCode).then(function(){alert("已复制");},function(){fallbackCopy();});}
 else fallbackCopy();
 function fallbackCopy(){var ta=document.createElement("textarea");ta.value=lastCode;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");alert("已复制");}catch(e){alert("复制失败，请手动长按复制");}document.body.removeChild(ta);}
};
document.getElementById("markSent").onclick=function(){
 if(!lastCode)return;var h=getHist();var it=h.find(function(x){return x.code===lastCode;});if(it){it.sent=true;saveHist(h);renderHist();alert("已标记发放");}
};
document.getElementById("chpw").onclick=function(){
 var v=prompt("输入新管理密码（至少6位）：");
 if(!v)return;if(v.length<6){alert("密码太短");return;}
 localStorage.setItem(PW_KEY,v);alert("密码已修改，请牢记");
};
document.getElementById("logout").onclick=function(){sessionStorage.removeItem(LOGIN_KEY);location.reload();};
</script>
</body>
</html>
